AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart application stack

Parameters:
  Environment:
    Type: String
    Default: prod

  VpcId:
    Type: AWS::EC2::VPC::Id

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id

  DBHost:
    Type: String

  DBName:
    Type: String

  DBUser:
    Type: String

  DBPasswordParameterName:
    Type: String

  ArtifactBucket:
    Type: String

Resources:

  #############################################
  # EventBridge
  #############################################

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus

  #############################################
  # SNS
  #############################################

  CloudMartNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-notifications

  #############################################
  # Authorizer Lambda
  #############################################

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-authorizer
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt AuthorizerExecutionRole.Arn
      Timeout: 10
      MemorySize: 256

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id

      Environment:
        Variables:
          ADMIN_TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/admin-token
          PRODUCTS_TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/products-token
          ORDERS_TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/orders-token

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: authorizer.zip

  AuthorizerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AuthorizerFunction
      AuthType: NONE

  AuthorizerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  #############################################
  # Product Lambda
  #############################################

  ProductFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-product
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt ProductExecutionRole.Arn
      Timeout: 30
      MemorySize: 256

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id

      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameterName

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: product.zip

  ProductFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ProductFunction
      AuthType: NONE

  ProductFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  #############################################
  # Order Lambda
  #############################################

  OrderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-order
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt OrderExecutionRole.Arn
      Timeout: 30
      MemorySize: 256

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id

      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameterName
          EVENT_BUS_NAME: !Ref CloudMartEventBus
          SNS_TOPIC_ARN: !Ref CloudMartNotificationTopic

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: order.zip

  OrderFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref OrderFunction
      AuthType: NONE

  OrderFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrderFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  #############################################
  # Apply Schema Lambda
  #############################################

  ApplySchemaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-apply-schema
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt ApplySchemaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id

      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameterName

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: apply-schema.zip

Outputs:

  AuthorizerFunctionUrl:
    Value: !GetAtt AuthorizerFunctionUrl.FunctionUrl

  ProductFunctionUrl:
    Value: !GetAtt ProductFunctionUrl.FunctionUrl

  OrderFunctionUrl:
    Value: !GetAtt OrderFunctionUrl.FunctionUrl

  EventBusName:
    Value: !Ref CloudMartEventBus

  NotificationTopicArn:
    Value: !Ref CloudMartNotificationTopic
