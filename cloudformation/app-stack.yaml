AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudMart app-stack — Lambda Authorizer, Product Lambda, Order Lambda,
  the EventBridge bus with its low-stock and order-confirmation rules,
  two SNS topics (delivering plain-text messages via EventBridge Input
  Transformers, not raw JSON), and a one-time schema-apply Lambda.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  LowStockThreshold:
    Type: Number
    Default: 10
    Description: Stock count below which a low-stock alert fires

  AlertEmail:
    Type: String
    Description: Email address to receive low-stock and order confirmation alerts

  DashboardInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the CloudMart Flask dashboard

  DashboardAmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0e34b50e714a297f1
    Description: Amazon Linux AMI used by the CloudMart dashboard EC2 instance in us-east-1


Resources:

  # ---------- EventBridge Event Bus ----------
  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-bus

  # ---------- SNS Topic: Low stock alerts ----------
  LowStockAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts

  LowStockAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref LowStockAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref LowStockAlertsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref LowStockAlertsTopic

  # ---------- SNS Topic: Order confirmations ----------
  OrderConfirmationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-order-confirmations

  OrderConfirmationsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderConfirmationsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  OrderConfirmationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OrderConfirmationsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OrderConfirmationsTopic

  # ---------- LAMBDA AUTHORIZER ----------
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-authorizer
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-authorizer-role-arn
      Timeout: 10
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          # Existing SecureString parameters are maintained in AWS SSM Parameter Store.
          # Their secret values are never passed through GitHub Actions or CloudFormation parameters.
          ADMIN_TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/admin-token
          PRODUCTS_TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/products-token
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
          DB_NAME: cloudmart
          PRODUCT_LAMBDA_NAME: !Ref ProductFunction
          ORDER_LAMBDA_NAME: !Ref OrderFunction
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/authorizer.zip

  AuthorizerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AuthorizerFunction
      AuthType: NONE

  AuthorizerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: AuthorizerFunctionUrl
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Both statements are required for a public (AuthType: NONE) Function
  # URL — this matches AWS's own documented default policy.
  # InvokeFunctionUrl lets the URL itself be hit; InvokeFunction is what
  # actually lets Lambda execute once invoked that way. This exact
  # resource has been dropped from this file multiple times during
  # full-file rewrites — if editing this template again, verify this
  # block survives the edit before committing.
  AuthorizerFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: AuthorizerFunctionUrl
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- PRODUCT SERVICE: Product Lambda ----------
  ProductFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-product
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-product-role-arn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
          DB_NAME: cloudmart
          EVENT_BUS_NAME: !Ref CloudMartEventBus
          LOW_STOCK_THRESHOLD: !Ref LowStockThreshold
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/product.zip

  # ---------- ORDER SERVICE: Order Lambda ----------
  OrderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-order
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-order-role-arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
          DB_NAME: cloudmart
          EVENT_BUS_NAME: !Ref CloudMartEventBus
          LOW_STOCK_THRESHOLD: !Ref LowStockThreshold
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/order.zip

  # ---------- EVENTBRIDGE RULE: low stock → SNS TOPIC ----------
  # InputTransformer rewrites the raw event JSON into a plain-text
  # message before SNS ever sees it — the email reads like a sentence,
  # not a JSON dump.
  LowStockAlertRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-low-stock-rule
      EventBusName: !Ref CloudMartEventBus
      EventPattern:
        source: ["cloudmart.inventory"]
        detail-type: ["InventoryChanged"]
        detail:
          stockCount:
            - numeric: ["<", !Ref LowStockThreshold]
      State: ENABLED
      Targets:
        - Arn: !Ref LowStockAlertsTopic
          Id: LowStockAlertsTarget
          InputTransformer:
            InputPathsMap:
              productId: "$.detail.productId"
              stockCount: "$.detail.stockCount"
            InputTemplate: >-
              "CloudMart Low Stock Alert: Product ID <productId> now has
              only <stockCount> units remaining. Please restock soon."

  # ---------- EVENTBRIDGE RULE: order confirmed → SNS TOPIC ----------
  OrderConfirmedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-order-confirmed-rule
      EventBusName: !Ref CloudMartEventBus
      EventPattern:
        source: ["cloudmart.orders"]
        detail-type: ["OrderConfirmed"]
      State: ENABLED
      Targets:
        - Arn: !Ref OrderConfirmationsTopic
          Id: OrderConfirmationsTarget
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.orderId"
              customerId: "$.detail.customerId"
              totalAmount: "$.detail.totalAmount"
            InputTemplate: >-
              "CloudMart Order Confirmation: Your order #<orderId> has
              been confirmed. Total amount: $<totalAmount>. Thank you
              for shopping with CloudMart, customer #<customerId>!"

  # ---------- EVENTBRIDGE RULE: order cancelled → SNS TOPIC ----------
  OrderCancelledRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-order-cancelled-rule
      EventBusName: !Ref CloudMartEventBus
      EventPattern:
        source: ["cloudmart.orders"]
        detail-type: ["OrderCancelled"]
      State: ENABLED
      Targets:
        - Arn: !Ref OrderConfirmationsTopic
          Id: OrderCancelledTarget
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.orderId"
              customerId: "$.detail.customerId"
              previousStatus: "$.detail.previousStatus"
            InputTemplate: >-
              "CloudMart Order Cancelled: Order #<orderId> for customer
              #<customerId> was cancelled from status <previousStatus>.
              Inventory has been restored."

  # ---------- EVENTBRIDGE RULE: order failed → SNS TOPIC ----------
  # Reuses the same order-confirmations topic so ops sees both outcomes
  # in one place; the message text makes clear which is which.
  OrderFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-order-failed-rule
      EventBusName: !Ref CloudMartEventBus
      EventPattern:
        source: ["cloudmart.orders"]
        detail-type: ["OrderFailed"]
      State: ENABLED
      Targets:
        - Arn: !Ref OrderConfirmationsTopic
          Id: OrderFailedTarget
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.orderId"
              customerId: "$.detail.customerId"
            InputTemplate: >-
              "CloudMart Order Failed: Order #<orderId> for customer
              #<customerId> could not be completed. Please check the
              order history for details."

  # ---------- One-time schema apply ----------
  ApplySchemaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-apply-schema
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-product-role-arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/apply-schema.zip

  # ---------- EC2 DASHBOARD ----------
  # CloudFormation creates the dashboard host and bootstraps the Flask
  # dashboard from the S3 artifact uploaded by GitHub Actions.
  DashboardInstanceV2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref DashboardAmiId
      InstanceType: !Ref DashboardInstanceType
      SubnetId:
        Fn::ImportValue: !Sub cloudmart-${Environment}-public-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub cloudmart-${Environment}-ec2-sg-id
      IamInstanceProfile:
        Fn::Select:
          - 1
          - Fn::Split:
              - /
              - Fn::ImportValue: !Sub cloudmart-${Environment}-ec2-dashboard-profile-arn
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-dashboard
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail

              REGION="${AWS_REGION_VALUE}"
              ENVIRONMENT="${ENVIRONMENT_VALUE}"
              ARTIFACTS_BUCKET="${ARTIFACTS_BUCKET_VALUE}"
              REPORTS_BUCKET="${REPORTS_BUCKET_VALUE}"
              DB_HOST="${DB_HOST_VALUE}"
              APP_DIR="/opt/cloudmart-dashboard"

              echo "CloudMart dashboard bootstrap started" | tee /var/log/cloudmart-dashboard-bootstrap.log

              # Keep SSM available for administration. It is NOT a deployment dependency.
              if ! command -v amazon-ssm-agent >/dev/null 2>&1; then
                dnf install -y amazon-ssm-agent || true
              fi
              systemctl enable amazon-ssm-agent || true
              systemctl start amazon-ssm-agent || true

              # Install the packages needed by the dashboard.
              dnf install -y python3 python3-pip python3-devel gcc unzip awscli

              # Wait until the EC2 role credentials are available.
              for attempt in $(seq 1 30); do
                if aws sts get-caller-identity --region "$REGION" >/dev/null 2>&1; then
                  break
                fi
                echo "Waiting for EC2 IAM credentials: $attempt/30" | tee -a /var/log/cloudmart-dashboard-bootstrap.log
                sleep 5
              done

              aws sts get-caller-identity --region "$REGION" >/dev/null 2>&1

              mkdir -p "$APP_DIR"
              rm -rf "$APP_DIR"/*

              # GitHub Actions uploads dashboard.zip before cloudmart-app is deployed.
              aws s3 cp "s3://$ARTIFACTS_BUCKET/dashboard/dashboard.zip"                 /tmp/dashboard.zip                 --region "$REGION"

              unzip -oq /tmp/dashboard.zip -d "$APP_DIR"

              test -f "$APP_DIR/app.py"
              test -f "$APP_DIR/requirements.txt"

              python3 -m venv "$APP_DIR/venv"
              "$APP_DIR/venv/bin/pip" install --upgrade pip
              "$APP_DIR/venv/bin/pip" install -r "$APP_DIR/requirements.txt"

              DB_USER=$(aws ssm get-parameter                 --name "/cloudmart/$ENVIRONMENT/db/username"                 --with-decryption                 --query 'Parameter.Value'                 --output text                 --region "$REGION")

              DB_PASSWORD=$(aws ssm get-parameter                 --name "/cloudmart/$ENVIRONMENT/db/password"                 --with-decryption                 --query 'Parameter.Value'                 --output text                 --region "$REGION")

              cat > /etc/cloudmart-dashboard.env <<EOF
              AWS_REGION=$REGION
              REPORTS_BUCKET=$REPORTS_BUCKET
              DB_HOST=$DB_HOST
              DB_NAME=cloudmart
              DB_USER=$DB_USER
              DB_PASSWORD=$DB_PASSWORD
              PORT=80
              EOF

              chmod 600 /etc/cloudmart-dashboard.env

              cat > /etc/systemd/system/cloudmart-dashboard.service <<EOF
              [Unit]
              Description=CloudMart Flask Dashboard
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              User=root
              WorkingDirectory=$APP_DIR
              EnvironmentFile=/etc/cloudmart-dashboard.env
              ExecStart=$APP_DIR/venv/bin/gunicorn --workers 2 --bind 0.0.0.0:80 app:app
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              EOF

              systemctl daemon-reload
              systemctl enable cloudmart-dashboard
              systemctl restart cloudmart-dashboard

              for attempt in $(seq 1 30); do
                if curl -fsS --max-time 5 http://127.0.0.1:80/ >/dev/null; then
                  echo "CloudMart dashboard is running on port 80" | tee -a /var/log/cloudmart-dashboard-bootstrap.log
                  exit 0
                fi
                sleep 5
              done

              echo "CloudMart dashboard did not start" | tee -a /var/log/cloudmart-dashboard-bootstrap.log
              systemctl status cloudmart-dashboard --no-pager || true
              journalctl -u cloudmart-dashboard --no-pager -n 100 || true
              exit 1
            - AWS_REGION_VALUE: !Ref AWS::Region
              ENVIRONMENT_VALUE: !Ref Environment
              ARTIFACTS_BUCKET_VALUE:
                Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
              REPORTS_BUCKET_VALUE:
                Fn::ImportValue: !Sub cloudmart-${Environment}-reports-bucket-name
              DB_HOST_VALUE:
                Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint

Outputs:
  AuthorizerFunctionUrl:
    Description: Public HTTPS entry point for the CloudMart API
    Value: !GetAtt AuthorizerFunctionUrl.FunctionUrl
    Export:
      Name: !Sub cloudmart-${Environment}-authorizer-url

  EventBusName:
    Value: !Ref CloudMartEventBus
    Export:
      Name: !Sub cloudmart-${Environment}-event-bus-name

  EventBusArn:
    Value: !GetAtt CloudMartEventBus.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-event-bus-arn

  LowStockAlertsTopicArn:
    Value: !Ref LowStockAlertsTopic
    Export:
      Name: !Sub cloudmart-${Environment}-low-stock-topic-arn

  OrderConfirmationsTopicArn:
    Value: !Ref OrderConfirmationsTopic
    Export:
      Name: !Sub cloudmart-${Environment}-order-confirmations-topic-arn

  ProductFunctionName:
    Value: !Ref ProductFunction
    Export:
      Name: !Sub cloudmart-${Environment}-product-function-name

  OrderFunctionName:
    Value: !Ref OrderFunction
    Export:
      Name: !Sub cloudmart-${Environment}-order-function-name

  DashboardInstanceId:
    Description: CloudFormation-created EC2 instance hosting the Flask dashboard
    Value: !Ref DashboardInstanceV2
    Export:
      Name: !Sub cloudmart-${Environment}-dashboard-instance-id

  DashboardPublicIp:
    Description: Public IPv4 address of the dashboard EC2 instance
    Value: !GetAtt DashboardInstanceV2.PublicIp
