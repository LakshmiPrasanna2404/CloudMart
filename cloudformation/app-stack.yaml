AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudMart app-stack (Milestone 3 scope) — Lambda Authorizer, Product
  Lambda, the EventBridge bus with its low-stock rule, the SNS low-stock
  topic, and a one-time schema-apply Lambda. Order and Report Generate
  Lambdas are added in a later milestone as an additive stack update.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  LowStockThreshold:
    Type: Number
    Default: 10
    Description: Stock count below which a low-stock alert fires

  AlertEmail:
    Type: String
    Description: Email address to receive low-stock alerts

Resources:

  # ---------- EventBridge Event Bus ----------
  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-bus

  # ---------- SNS Topic: Low stock alerts ----------
  LowStockAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts

  LowStockAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref LowStockAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref LowStockAlertsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref LowStockAlertsTopic

  # ---------- LAMBDA AUTHORIZER ----------
  # Public entry point via Function URL — checks the token, then invokes
  # Product Lambda directly. Order routing will be added once OrderFunction
  # exists in a later milestone.
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-authorizer
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-authorizer-role-arn
      Timeout: 10
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          AUTH_TOKEN_PARAM: !Sub /cloudmart/${Environment}/auth/token
          PRODUCT_LAMBDA_NAME: !Ref ProductFunction
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/authorizer.zip

  AuthorizerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AuthorizerFunction
      AuthType: NONE

  # Two separate permission statements are both required for a public
  # (AuthType: NONE) Function URL — this matches AWS's own documented
  # default policy. lambda:InvokeFunctionUrl lets the URL itself be hit;
  # lambda:InvokeFunction is what actually lets Lambda execute the
  # function once invoked that way. FunctionUrlAuthType is only a valid
  # condition on the InvokeFunctionUrl action — the equivalent guard for
  # the InvokeFunction action is the separate InvokedViaFunctionUrl
  # property, which restricts this permission to function-URL calls only
  # (not direct lambda:Invoke from anywhere else).
  AuthorizerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: AuthorizerFunctionUrl
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AuthorizerFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: AuthorizerFunctionUrl
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- PRODUCT SERVICE: Product Lambda ----------
  ProductFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-product
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-product-role-arn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
          DB_NAME: cloudmart
          EVENT_BUS_NAME: !Ref CloudMartEventBus
          LOW_STOCK_THRESHOLD: !Ref LowStockThreshold
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/product.zip

  # ---------- EVENTBRIDGE RULE: low stock → SNS TOPIC ----------
  LowStockAlertRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-low-stock-rule
      EventBusName: !Ref CloudMartEventBus
      EventPattern:
        source: ["cloudmart.inventory"]
        detail-type: ["InventoryChanged"]
        detail:
          stockCount:
            - numeric: ["<", !Ref LowStockThreshold]
      State: ENABLED
      Targets:
        - Arn: !Ref LowStockAlertsTopic
          Id: LowStockAlertsTarget

  # ---------- One-time schema apply ----------
  ApplySchemaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-apply-schema
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-product-role-arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/apply-schema.zip

Outputs:
  AuthorizerFunctionUrl:
    Description: Public HTTPS entry point for the CloudMart API
    Value: !GetAtt AuthorizerFunctionUrl.FunctionUrl
    Export:
      Name: !Sub cloudmart-${Environment}-authorizer-url

  EventBusName:
    Value: !Ref CloudMartEventBus
    Export:
      Name: !Sub cloudmart-${Environment}-event-bus-name

  EventBusArn:
    Value: !GetAtt CloudMartEventBus.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-event-bus-arn

  LowStockAlertsTopicArn:
    Value: !Ref LowStockAlertsTopic
    Export:
      Name: !Sub cloudmart-${Environment}-low-stock-topic-arn

  ProductFunctionName:
    Value: !Ref ProductFunction
    Export:
      Name: !Sub cloudmart-${Environment}-product-function-name
