AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudMart app-stack — Lambda Authorizer, Product Lambda, Order Lambda,
  the EventBridge bus with its low-stock and order-confirmation rules,
  two SNS topics (delivering plain-text messages via EventBridge Input
  Transformers, not raw JSON), and a one-time schema-apply Lambda.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  LowStockThreshold:
    Type: Number
    Default: 10
    Description: Stock count below which a low-stock alert fires

  AlertEmail:
    Type: String
    Description: Email address to receive low-stock and order confirmation alerts


  DashboardInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the CloudMart Flask dashboard

  DashboardAmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0b245cc5f82576748
    Description: Amazon Linux 2023 AMI for the CloudMart dashboard EC2 instance


Resources:

  # ---------- EventBridge Event Bus ----------
  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-bus

  # ---------- SNS Topic: Low stock alerts ----------
  LowStockAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts

  LowStockAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref LowStockAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref LowStockAlertsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref LowStockAlertsTopic

  # ---------- SNS Topic: Order confirmations ----------
  OrderConfirmationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-order-confirmations

  OrderConfirmationsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderConfirmationsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  OrderConfirmationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OrderConfirmationsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OrderConfirmationsTopic

  # ---------- LAMBDA AUTHORIZER ----------
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-authorizer
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-authorizer-role-arn
      Timeout: 10
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          # Existing SecureString parameters are maintained in AWS SSM Parameter Store.
          # Their secret values are never passed through GitHub Actions or CloudFormation parameters.
          ADMIN_TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/admin-token
          PRODUCTS_TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/products-token
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
          DB_NAME: cloudmart
          PRODUCT_LAMBDA_NAME: !Ref ProductFunction
          ORDER_LAMBDA_NAME: !Ref OrderFunction
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/authorizer.zip

  AuthorizerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AuthorizerFunction
      AuthType: NONE

  AuthorizerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: AuthorizerFunctionUrl
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Both statements are required for a public (AuthType: NONE) Function
  # URL — this matches AWS's own documented default policy.
  # InvokeFunctionUrl lets the URL itself be hit; InvokeFunction is what
  # actually lets Lambda execute once invoked that way. This exact
  # resource has been dropped from this file multiple times during
  # full-file rewrites — if editing this template again, verify this
  # block survives the edit before committing.
  AuthorizerFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: AuthorizerFunctionUrl
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- PRODUCT SERVICE: Product Lambda ----------
  ProductFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-product
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-product-role-arn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
          DB_NAME: cloudmart
          EVENT_BUS_NAME: !Ref CloudMartEventBus
          LOW_STOCK_THRESHOLD: !Ref LowStockThreshold
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/product.zip

  # ---------- ORDER SERVICE: Order Lambda ----------
  OrderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-order
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-order-role-arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
          DB_NAME: cloudmart
          EVENT_BUS_NAME: !Ref CloudMartEventBus
          LOW_STOCK_THRESHOLD: !Ref LowStockThreshold
          FROM_EMAIL: !Ref AlertEmail
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/order.zip


  # Receives OrderConfirmed / OrderFailed events and sends the email
  # to the customerEmail contained in the EventBridge event.
  # ---------- EVENTBRIDGE RULE: low stock → SNS TOPIC ----------
  # InputTransformer rewrites the raw event JSON into a plain-text
  # message before SNS ever sees it — the email reads like a sentence,
  # not a JSON dump.
  LowStockAlertRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-low-stock-rule
      EventBusName: !Ref CloudMartEventBus
      EventPattern:
        source: ["cloudmart.inventory"]
        detail-type: ["InventoryChanged"]
        detail:
          stockCount:
            - numeric: ["<", !Ref LowStockThreshold]
      State: ENABLED
      Targets:
        - Arn: !Ref LowStockAlertsTopic
          Id: LowStockAlertsTarget
          InputTransformer:
            InputPathsMap:
              productId: "$.detail.productId"
              stockCount: "$.detail.stockCount"
            InputTemplate: >-
              "CloudMart Low Stock Alert: Product ID <productId> now has
              only <stockCount> units remaining. Please restock soon."

  # ---------- EVENTBRIDGE RULE: order cancelled → SNS TOPIC ----------
  OrderCancelledRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-order-cancelled-rule
      EventBusName: !Ref CloudMartEventBus
      EventPattern:
        source: ["cloudmart.orders"]
        detail-type: ["OrderCancelled"]
      State: ENABLED
      Targets:
        - Arn: !Ref OrderConfirmationsTopic
          Id: OrderCancelledTarget
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.orderId"
              customerId: "$.detail.customerId"
              previousStatus: "$.detail.previousStatus"
            InputTemplate: >-
              "CloudMart Order Cancelled: Order #<orderId> for customer
              #<customerId> was cancelled from status <previousStatus>.
              Inventory has been restored."


  # ---------- EC2 DASHBOARD ----------
  # CloudFormation creates the dashboard host. The UserData below is
  # intentionally limited to EC2/SSM bootstrap. GitHub Actions deploys
  # the Flask application through AWS Systems Manager after the instance
  # becomes Online.
  DashboardInstanceV2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref DashboardAmiId
      InstanceType: !Ref DashboardInstanceType
      SubnetId:
        Fn::ImportValue: !Sub cloudmart-${Environment}-public-subnet-id
      SecurityGroupIds:
        - Fn::ImportValue: !Sub cloudmart-${Environment}-ec2-sg-id
      IamInstanceProfile:
        Fn::Select:
          - 1
          - Fn::Split:
              - /
              - Fn::ImportValue: !Sub cloudmart-${Environment}-ec2-dashboard-profile-arn
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-dashboard
        - Key: Project
          Value: CloudMart
        - Key: Component
          Value: Dashboard
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euxo pipefail

              # UserData runs as root. Keep a simple bootstrap log so that
              # SSM/bootstrap failures are visible without needing SSM first.
              exec > >(tee -a /var/log/cloudmart-ssm-bootstrap.log) 2>&1

              REGION="${AWS_REGION_VALUE}"
              ROLE_NAME=""

              echo "========================================"
              echo "CloudMart dashboard EC2 bootstrap started"
              date
              echo "Region: $REGION"
              echo "========================================"

              echo "Checking EC2 IAM role credentials..."

              # Wait for the instance profile credentials to become available.
              # IMDSv2 is required by the instance MetadataOptions above.
              TOKEN=""
              for attempt in $(seq 1 30); do
                TOKEN=$(curl -fsS --max-time 3 \
                  -X PUT \
                  -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
                  http://169.254.169.254/latest/api/token 2>/dev/null || true)

                if [ -n "$TOKEN" ]; then
                  ROLE_NAME=$(curl -fsS --max-time 3 \
                    -H "X-aws-ec2-metadata-token: $TOKEN" \
                    http://169.254.169.254/latest/meta-data/iam/security-credentials/ \
                    2>/dev/null || true)

                  if [ -n "$ROLE_NAME" ]; then
                    echo "EC2 IAM role detected: $ROLE_NAME"
                    break
                  fi
                fi

                echo "Waiting for EC2 IAM credentials: $attempt/30"
                sleep 5
              done

              if [ -z "$TOKEN" ] || [ -z "$ROLE_NAME" ]; then
                echo "ERROR: EC2 instance profile credentials were not available."
                exit 1
              fi

              echo "Installing/checking SSM Agent..."

              # Amazon Linux 2023 normally includes the SSM Agent. If it is
              # absent, install it from the configured package repositories.
              if ! command -v amazon-ssm-agent >/dev/null 2>&1; then
                echo "SSM Agent binary not found; installing it..."
                dnf install -y amazon-ssm-agent
              else
                echo "SSM Agent binary already exists."
              fi

              echo "Starting SSM Agent..."
              systemctl enable amazon-ssm-agent
              systemctl restart amazon-ssm-agent

              sleep 5

              echo "SSM Agent service status:"
              systemctl status amazon-ssm-agent --no-pager || true

              if ! systemctl is-active --quiet amazon-ssm-agent; then
                echo "ERROR: amazon-ssm-agent.service is not active."
                journalctl -u amazon-ssm-agent --no-pager -n 100 || true
                exit 1
              fi

              echo "Verifying AWS credentials from the EC2 instance..."

              # AWS CLI is normally available on the selected Amazon Linux AMI.
              # Install it if necessary before the STS verification.
              if ! command -v aws >/dev/null 2>&1; then
                dnf install -y awscli
              fi

              for attempt in $(seq 1 30); do
                if aws sts get-caller-identity --region "$REGION" >/tmp/cloudmart-sts.json 2>/tmp/cloudmart-sts-error.log; then
                  echo "EC2 IAM credentials are working:"
                  cat /tmp/cloudmart-sts.json
                  break
                fi

                echo "Waiting for working EC2 IAM credentials: $attempt/30"
                cat /tmp/cloudmart-sts-error.log || true
                sleep 5
              done

              if ! aws sts get-caller-identity --region "$REGION" >/tmp/cloudmart-sts.json 2>/tmp/cloudmart-sts-error.log; then
                echo "ERROR: EC2 IAM credentials cannot call STS."
                cat /tmp/cloudmart-sts-error.log || true
                exit 1
              fi

              echo "Testing SSM endpoint connectivity from the EC2 instance..."

              # HTTP 400 is acceptable here: it proves the HTTPS endpoint is
              # reachable. We only need to fail on connection/DNS failure.
              curl -fsS --connect-timeout 10 \
                "https://ssm.$REGION.amazonaws.com" \
                -o /tmp/cloudmart-ssm-response.txt || true

              curl -fsS --connect-timeout 10 \
                "https://ssmmessages.$REGION.amazonaws.com" \
                -o /tmp/cloudmart-ssmmessages-response.txt || true

              echo "SSM Agent bootstrap completed successfully."
              echo "The instance will now register with AWS Systems Manager."
              date
            - AWS_REGION_VALUE: !Ref AWS::Region

  # ---------- One-time schema apply ----------
  ApplySchemaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-apply-schema
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub cloudmart-${Environment}-product-role-arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub cloudmart-${Environment}-rds-endpoint
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub cloudmart-${Environment}-artifacts-bucket-name
        S3Key: lambdas/apply-schema.zip

Outputs:
  AuthorizerFunctionUrl:
    Description: Public HTTPS entry point for the CloudMart API
    Value: !GetAtt AuthorizerFunctionUrl.FunctionUrl
    Export:
      Name: !Sub cloudmart-${Environment}-authorizer-url

  EventBusName:
    Value: !Ref CloudMartEventBus
    Export:
      Name: !Sub cloudmart-${Environment}-event-bus-name

  EventBusArn:
    Value: !GetAtt CloudMartEventBus.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-event-bus-arn

  LowStockAlertsTopicArn:
    Value: !Ref LowStockAlertsTopic
    Export:
      Name: !Sub cloudmart-${Environment}-low-stock-topic-arn

  OrderConfirmationsTopicArn:
    Value: !Ref OrderConfirmationsTopic
    Export:
      Name: !Sub cloudmart-${Environment}-order-confirmations-topic-arn

  ProductFunctionName:
    Value: !Ref ProductFunction
    Export:
      Name: !Sub cloudmart-${Environment}-product-function-name

  OrderFunctionName:
    Value: !Ref OrderFunction
    Export:
      Name: !Sub cloudmart-${Environment}-order-function-name


  DashboardInstanceId:
    Description: CloudFormation-created EC2 instance hosting the Flask dashboard
    Value: !Ref DashboardInstanceV2
    Export:
      Name: !Sub cloudmart-${Environment}-dashboard-instance-id

  DashboardPublicIp:
    Description: Public IPv4 address of the CloudMart dashboard EC2 instance
    Value: !GetAtt DashboardInstanceV2.PublicIp
    Export:
      Name: !Sub cloudmart-${Environment}-dashboard-public-ip

  DashboardPublicDnsName:
    Description: Public DNS name of the CloudMart dashboard EC2 instance
    Value: !GetAtt DashboardInstanceV2.PublicDnsName
    Export:
      Name: !Sub cloudmart-${Environment}-dashboard-public-dns-name

