AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart iam-stack — execution roles for the Authorizer, Product, Order,
  and Report Generate Lambdas, plus the EC2 dashboard instance role.
  Every role is scoped to the specific actions and resource ARNs
  that the function needs.

Parameters:

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]


Resources:

  # ============================================================
  # AUTHORIZER EXECUTION ROLE
  # ============================================================

  AuthorizerExecutionRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-authorizer-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

        - PolicyName: AuthorizerPermissions

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # ------------------------------------------------
              # APPLICATION AUTHENTICATION TOKENS
              # ------------------------------------------------

              - Sid: ReadApplicationAuthTokens

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/admin-token

                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/products-token


              # ------------------------------------------------
              # DATABASE CREDENTIALS
              # ------------------------------------------------

              - Sid: ReadDatabaseCredentials

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username

                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


              # ------------------------------------------------
              # INVOKE DOWNSTREAM LAMBDAS
              # ------------------------------------------------

              - Sid: InvokeDownstreamLambdas

                Effect: Allow

                Action:
                  - lambda:InvokeFunction

                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cloudmart-${Environment}-product

                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cloudmart-${Environment}-order


              # ------------------------------------------------
              # SES CUSTOMER EMAIL VERIFICATION
              # ------------------------------------------------
              # When a new customer registers, the Authorizer
              # automatically requests SES verification.
              # SES sends the verification email to the customer.
              # ------------------------------------------------

              - Sid: VerifyCustomerEmail

                Effect: Allow

                Action:
                  - ses:VerifyEmailIdentity

                Resource: "*"


              # ------------------------------------------------
              # AUTHORIZER CLOUDWATCH LOGS
              # ------------------------------------------------

              - Sid: OwnLogGroupOnly

                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-authorizer:*


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-authorizer-role


  # ============================================================
  # PRODUCT LAMBDA EXECUTION ROLE
  # ============================================================

  ProductLambdaExecutionRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-product-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

        - PolicyName: ProductLambdaPermissions

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Sid: ReadDbCredentials

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


              - Sid: PublishInventoryEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-bus


              - Sid: PublishCustomMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:
                  StringEquals:
                    cloudwatch:namespace: cloudmart


              - Sid: OwnLogGroupOnly

                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-product:*


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-role


  # ============================================================
  # ORDER LAMBDA EXECUTION ROLE
  # ============================================================

  OrderLambdaExecutionRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-order-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

        - PolicyName: OrderLambdaPermissions

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Sid: ReadDbCredentials

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


              - Sid: PublishOrderEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-bus


              - Sid: PublishCustomMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:
                  StringEquals:
                    cloudwatch:namespace: cloudmart


              - Sid: PublishLowStockAlerts

                Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-low-stock-alerts


              # ------------------------------------------------
              # SES CUSTOMER ORDER CONFIRMATION EMAILS
              # ------------------------------------------------

              - Sid: AllowSESSendEmail

                Effect: Allow

                Action:
                  - ses:SendEmail

                Resource: "*"


              - Sid: OwnLogGroupOnly

                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-order:*


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-order-role


  # ============================================================
  # REPORT GENERATE LAMBDA EXECUTION ROLE
  # ============================================================

  ReportLambdaExecutionRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-report-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

        - PolicyName: ReportLambdaPermissions

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Sid: ReadDbCredentials

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


              - Sid: WriteReportsOnly

                Effect: Allow

                Action:
                  - s3:PutObject

                Resource:
                  !Sub arn:aws:s3:::cloudmart-reports-${AWS::AccountId}/reports/*


              - Sid: OwnLogGroupOnly

                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-${Environment}-report-generate:*


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-report-role


  # ============================================================
  # EC2 DASHBOARD INSTANCE ROLE
  # ============================================================

  EC2DashboardInstanceRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-ec2-dashboard-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service: ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      # Required for SSM Session Manager / Run Command
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        - PolicyName: EC2DashboardPermissions

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Sid: ReadReportsOnly

                Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  !Sub arn:aws:s3:::cloudmart-reports-${AWS::AccountId}/reports/*


              # ------------------------------------------------
              # DASHBOARD DEPLOYMENT ARTIFACT
              # ------------------------------------------------

              - Sid: ReadDashboardArtifact

                Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  !Sub arn:aws:s3:::cloudmart-artifacts-${AWS::AccountId}/dashboard/dashboard.zip


              - Sid: ReadDbConfigOnly

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host

                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name

                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username

                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


              - Sid: OwnLogGroupOnly

                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/cloudmart/${Environment}/dashboard:*


      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ec2-dashboard-role


  # ============================================================
  # EC2 INSTANCE PROFILE
  # ============================================================

  EC2DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      InstanceProfileName:
        !Sub cloudmart-${Environment}-ec2-dashboard-profile

      Roles:
        - !Ref EC2DashboardInstanceRole


  # ============================================================
  # CLOUDMARTPROJECT DASHBOARD SSM DEPLOYMENT POLICY
  # ============================================================
  #
  # CloudMartProject is the existing GitHub OIDC /
  # CloudFormation deployment role.
  #
  # We do NOT create CloudMartProject here.
  #
  # This policy is attached to the already-existing role so that
  # GitHub Actions can deploy the Flask dashboard through SSM.
  #
  # The EC2 instance ID is intentionally not hardcoded because
  # CloudFormation may create a new dashboard instance.
  #
  # ============================================================

  CloudMartProjectDashboardSSMPolicy:
    Type: AWS::IAM::Policy

    Properties:
      PolicyName: CloudMartProjectDashboardSSMDeployment

      Roles:
        - CloudMartProject

      PolicyDocument:
        Version: "2012-10-17"

        Statement:

          # ------------------------------------------------
          # SEND DASHBOARD DEPLOYMENT COMMAND
          # ------------------------------------------------

          - Sid: DeployDashboardThroughSSM

            Effect: Allow

            Action:
              - ssm:SendCommand

            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript

              - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*


          # ------------------------------------------------
          # READ SSM COMMAND RESULTS
          # ------------------------------------------------

          - Sid: ReadDashboardSSMCommandResult

            Effect: Allow

            Action:
              - ssm:GetCommandInvocation
              - ssm:ListCommandInvocations
              - ssm:ListCommands

            Resource: "*"


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  AuthorizerRoleArn:
    Value: !GetAtt AuthorizerExecutionRole.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-authorizer-role-arn


  ProductRoleArn:
    Value: !GetAtt ProductLambdaExecutionRole.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-product-role-arn


  OrderRoleArn:
    Value: !GetAtt OrderLambdaExecutionRole.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-order-role-arn


  ReportRoleArn:
    Value: !GetAtt ReportLambdaExecutionRole.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-report-role-arn


  EC2DashboardInstanceProfileArn:
    Value: !GetAtt EC2DashboardInstanceProfile.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-ec2-dashboard-profile-arn
