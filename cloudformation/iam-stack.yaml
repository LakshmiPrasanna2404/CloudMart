AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM resources for Lambda functions and EC2 dashboard.
  CloudMartProject is managed separately as the GitHub Actions/OIDC
  deployment role and is intentionally not created by this stack.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

Resources:

  # ============================================================
  # Lambda Authorizer Execution Role
  # ============================================================
  AuthorizerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-authorizer-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: AuthorizerSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

  # ============================================================
  # Product Lambda Execution Role
  # ============================================================
  ProductLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-product-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ProductLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # RDS / Secrets Manager access
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # ============================================================
  # Order Lambda Execution Role
  # ============================================================
  OrderLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-order-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: OrderLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'

              # EventBridge
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'

              # SNS
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'

              # CloudWatch metrics
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # ============================================================
  # Report Lambda Execution Role
  # ============================================================
  ReportLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-report-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ReportLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # S3 report access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: '*'

              # SSM database credentials
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*

              # Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # ============================================================
  # EC2 Dashboard Instance Role
  # ============================================================
  EC2DashboardInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-ec2-dashboard-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:
        - PolicyName: DashboardAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch dashboard / metrics
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetDashboard
                Resource: '*'

              # S3 report access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: '*'

              # SSM parameter access
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*

  # ============================================================
  # EC2 Dashboard Instance Profile
  # ============================================================
  EC2DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub cloudmart-${Environment}-ec2-dashboard-profile
      Roles:
        - !Ref EC2DashboardInstanceRole

# ==============================================================
# Outputs
# ==============================================================

Outputs:

  AuthorizerRoleArn:
    Description: Lambda authorizer execution role ARN
    Value: !GetAtt AuthorizerExecutionRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerRoleArn

  ProductRoleArn:
    Description: Product Lambda execution role ARN
    Value: !GetAtt ProductLambdaExecutionRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductRoleArn

  OrderRoleArn:
    Description: Order Lambda execution role ARN
    Value: !GetAtt OrderLambdaExecutionRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderRoleArn

  ReportRoleArn:
    Description: Report Lambda execution role ARN
    Value: !GetAtt ReportLambdaExecutionRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ReportRoleArn

  EC2DashboardInstanceProfileArn:
    Description: EC2 dashboard instance profile ARN
    Value: !GetAtt EC2DashboardInstanceProfile.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-EC2DashboardInstanceProfileArn
