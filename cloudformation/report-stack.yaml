AWSTemplateFormatVersion: "2010-09-09"

Description: CloudMart report-generation Lambda

Parameters:

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  ReportLambdaRoleArn:
    Type: String
    Description: IAM role ARN for the report-generation Lambda

  DBHost:
    Type: String
    Description: RDS endpoint hostname

  ReportsBucketName:
    Type: String
    Description: S3 bucket for generated reports

  DBUsernameParameter:
    Type: String
    Default: ""
    Description: Optional SSM parameter name for the database username. If empty, uses /cloudmart/<Environment>/db/username.

  DBPasswordParameter:
    Type: String
    Default: ""
    Description: Optional SSM parameter name for the database password. If empty, uses /cloudmart/<Environment>/db/password.

  ArtifactBucketName:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  ArtifactKey:
    Type: String
    Default: lambdas/report-generate/report-generate.zip

  ScheduleExpression:
    Type: String
    Default: cron(0 0 * * ? *)

Conditions:

  HasDBUsernameParameter:
    !Not
      - !Equals
        - !Ref DBUsernameParameter
        - ""

  HasDBPasswordParameter:
    !Not
      - !Equals
        - !Ref DBPasswordParameter
        - ""

Resources:

  ReportGenerateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-report-generate
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !Ref ReportLambdaRoleArn
      Timeout: 120
      MemorySize: 512

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub cloudmart-${Environment}-lambda-sg-id

      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ArtifactKey

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          REPORTS_BUCKET: !Ref ReportsBucketName
          DB_HOST: !Ref DBHost
          DB_NAME: cloudmart

          DB_USERNAME_PARAMETER: !If
            - HasDBUsernameParameter
            - !Ref DBUsernameParameter
            - !Sub /cloudmart/${Environment}/db/username

          DB_PASSWORD_PARAMETER: !If
            - HasDBPasswordParameter
            - !Ref DBPasswordParameter
            - !Sub /cloudmart/${Environment}/db/password

  ReportScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-daily-report
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: ReportGenerateTarget
          Arn: !GetAtt ReportGenerateFunction.Arn

  AllowEventBridgeInvokeReport:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportGenerateFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReportScheduleRule.Arn

Outputs:

  ReportGenerateFunctionName:
    Value: !Ref ReportGenerateFunction
    Export:
      Name: !Sub cloudmart-${Environment}-report-generate-function-name

  ReportScheduleRuleArn:
    Description: ARN of the daily EventBridge report schedule
    Value: !GetAtt ReportScheduleRule.Arn
    Export:
      Name: !Sub cloudmart-${Environment}-report-schedule-rule-arn

  ReportScheduleExpression:
    Description: Schedule used to generate the reports
    Value: !Ref ScheduleExpression
