AWSTemplateFormatVersion: "2010-09-09"

Description: CloudMart monitoring, CloudWatch alarms, and SNS notifications

Parameters:

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  AlertEmail:
    Type: String
    Default: ""

  DBInstanceIdentifier:
    Type: String
    Default: cloudmart-prod-db

  LambdaErrorThreshold:
    Type: Number
    Default: 1

  AlarmEvaluationPeriods:
    Type: Number
    Default: 2

Conditions:

  HasAlertEmail:
    !Not
      - !Equals
        - !Ref AlertEmail
        - ""

Resources:

  MonitoringAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-monitoring-alerts

  MonitoringEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref MonitoringAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AuthorizerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-authorizer-duration
      AlarmDescription: Authorizer Lambda duration is high.
      Namespace: AWS/Lambda
      MetricName: Duration
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-authorizer

  AuthorizerLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-authorizer-errors
      AlarmDescription: Authorizer Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-authorizer
      AlarmActions:
        - !Ref MonitoringAlertsTopic

  ProductLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-product-errors
      AlarmDescription: Product Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-product
      AlarmActions:
        - !Ref MonitoringAlertsTopic

  OrderLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-order-errors
      AlarmDescription: Order Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-order
      AlarmActions:
        - !Ref MonitoringAlertsTopic

  ReportLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-report-errors
      AlarmDescription: Report Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-report-generate
      AlarmActions:
        - !Ref MonitoringAlertsTopic

  RDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-rds-high-cpu
      AlarmDescription: RDS CPU utilization is high.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceIdentifier
      AlarmActions:
        - !Ref MonitoringAlertsTopic

  RDSFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-rds-low-storage
      AlarmDescription: RDS free storage is low.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5368709120
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceIdentifier
      AlarmActions:
        - !Ref MonitoringAlertsTopic

Outputs:

  MonitoringTopicArn:
    Description: SNS topic ARN for CloudMart monitoring alerts
    Value: !Ref MonitoringAlertsTopic
    Export:
      Name: !Sub cloudmart-${Environment}-monitoring-topic-arn
