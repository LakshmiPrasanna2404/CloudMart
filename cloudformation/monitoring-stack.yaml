AWSTemplateFormatVersion: "2010-09-09"

Description: CloudMart monitoring, CloudWatch alarms, and SNS notifications

Parameters:

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  AlertEmail:
    Type: String
    Default: ""

  DBInstanceIdentifier:
    Type: String
    Default: cloudmart-prod-db

  LambdaErrorThreshold:
    Type: Number
    Default: 1

  AlarmEvaluationPeriods:
    Type: Number
    Default: 2

Conditions:

  HasAlertEmail:
    !Not
      - !Equals
        - !Ref AlertEmail
        - ""

Resources:

  MonitoringTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-monitoring-alerts

  MonitoringEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref MonitoringTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AuthorizerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-authorizer-duration
      AlarmDescription: Authorizer Lambda duration is high.
      Namespace: AWS/Lambda
      MetricName: Duration
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-authorizer
      AlarmActions:
        - !Ref MonitoringTopic

  AuthorizerLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-authorizer-errors
      AlarmDescription: Authorizer Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-authorizer
      AlarmActions:
        - !Ref MonitoringTopic

  ProductLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-product-errors
      AlarmDescription: Product Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-product
      AlarmActions:
        - !Ref MonitoringTopic

  OrderLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-order-errors
      AlarmDescription: Order Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-order
      AlarmActions:
        - !Ref MonitoringTopic

  ReportLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-report-errors
      AlarmDescription: Report Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Sub cloudmart-${Environment}-report-generate
      AlarmActions:
        - !Ref MonitoringTopic

  RDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-rds-high-cpu
      AlarmDescription: RDS CPU utilization is high.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceIdentifier
      AlarmActions:
        - !Ref MonitoringTopic

  RDSFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudmart-${Environment}-rds-low-storage
      AlarmDescription: RDS free storage is low.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5368709120
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceIdentifier
      AlarmActions:
        - !Ref MonitoringTopic

  CloudMartDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub cloudmart-${Environment}-operations
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Orders Placed",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [["cloudmart", "OrdersPlaced", "Environment", "${Environment}"]]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Orders Cancelled",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [["cloudmart", "OrdersCancelled", "Environment", "${Environment}"]]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Orders Failed by Reason",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["cloudmart", "OrdersFailed", "Environment", "${Environment}", "Reason", "DB_ERROR", {"label": "DB_ERROR"}],
                  ["...", "Reason", "INTERNAL_ERROR", {"label": "INTERNAL_ERROR"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Low Stock Events",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [{"expression": "SEARCH('{cloudmart,Environment,ProductId} MetricName=\\\"LowStockEvents\\\" Environment=\\\"${Environment}\\\"', 'Sum', 300)", "label": "Low Stock Events", "id": "e1"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Invocations",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "cloudmart-${Environment}-authorizer", {"label": "Authorizer"}],
                  [".", ".", ".", "cloudmart-${Environment}-product", {"label": "Product"}],
                  [".", ".", ".", "cloudmart-${Environment}-order", {"label": "Order"}],
                  [".", ".", ".", "cloudmart-${Environment}-report-generate", {"label": "Report"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Errors",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "cloudmart-${Environment}-authorizer", {"label": "Authorizer"}],
                  [".", ".", ".", "cloudmart-${Environment}-product", {"label": "Product"}],
                  [".", ".", ".", "cloudmart-${Environment}-order", {"label": "Order"}],
                  [".", ".", ".", "cloudmart-${Environment}-report-generate", {"label": "Report"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Duration",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Average",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "cloudmart-${Environment}-authorizer", {"label": "Authorizer"}],
                  [".", ".", ".", "cloudmart-${Environment}-product", {"label": "Product"}],
                  [".", ".", ".", "cloudmart-${Environment}-order", {"label": "Order"}],
                  [".", ".", ".", "cloudmart-${Environment}-report-generate", {"label": "Report"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "RDS CPU Utilization",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Average",
                "metrics": [["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DBInstanceIdentifier}"]]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 24,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "RDS Free Storage",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Average",
                "metrics": [["AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${DBInstanceIdentifier}"]]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 24,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "RDS Database Connections",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Average",
                "metrics": [["AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${DBInstanceIdentifier}"]]
              }
            }
          ]
        }

Outputs:

  MonitoringTopicArn:
    Description: SNS topic ARN for CloudMart monitoring alerts
    Value: !Ref MonitoringTopic
    Export:
      Name: !Sub cloudmart-${Environment}-monitoring-topic-arn
