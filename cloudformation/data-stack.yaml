AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart data-stack — RDS MySQL database and S3 buckets for
  Lambda deployment artifacts and daily reports.

Parameters:

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name

  DBMasterUsername:
    Type: String
    Default: "{{resolve:ssm-secure:/cloudmart/prod/db/username:1}}"
    NoEcho: true
    Description: RDS master username from SSM Parameter Store

  DBMasterUserPassword:
    Type: String
    Default: "{{resolve:ssm-secure:/cloudmart/prod/db/password:1}}"
    NoEcho: true
    Description: RDS master password from SSM Parameter Store


Resources:

  # ============================================================
  # RDS SUBNET GROUP
  # ============================================================

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub >
        CloudMart RDS subnet group for ${Environment}
      SubnetIds:
        - Fn::ImportValue:
            !Sub cloudmart-${Environment}-private-subnet-id
        - Fn::ImportValue:
            !Sub cloudmart-${Environment}-private-subnet-2-id

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group


  # ============================================================
  # RDS MYSQL
  # ============================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-mysql

      Engine: mysql
      EngineVersion: "8.0"

      DBInstanceClass: db.t3.micro

      AllocatedStorage: 20
      StorageType: gp2
      MaxAllocatedStorage: 50

      DBName: !Ref DBName

      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterUserPassword

      DBSubnetGroupName: !Ref RDSSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue:
            !Sub cloudmart-${Environment}-rds-sg-id

      PubliclyAccessible: false

      MultiAZ: false

      StorageEncrypted: true

      BackupRetentionPeriod: 7

      AutoMinorVersionUpgrade: true

      EnableCloudwatchLogsExports:
        - error
        - general
        - slowquery

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-mysql
        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # S3 BUCKET - LAMBDA DEPLOYMENT ARTIFACTS
  # ============================================================

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-artifacts
        - Key: Purpose
          Value: Lambda deployment packages


  # ============================================================
  # S3 BUCKET - DAILY REPORTS
  # ============================================================

  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports
        - Key: Purpose
          Value: Daily sales reports


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  RDSEndpoint:
    Description: RDS MySQL endpoint
    Value: !GetAtt CloudMartDatabase.Endpoint.Address
    Export:
      Name: !Sub cloudmart-${Environment}-rds-endpoint


  RDSInstanceIdentifier:
    Description: RDS instance identifier
    Value: !Ref CloudMartDatabase
    Export:
      Name: !Sub cloudmart-${Environment}-rds-instance-id


  ArtifactsBucketName:
    Description: S3 bucket for Lambda deployment artifacts
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub cloudmart-${Environment}-artifacts-bucket


  ReportsBucketName:
    Description: S3 bucket for daily CSV reports
    Value: !Ref ReportsBucket
    Export:
      Name: !Sub cloudmart-${Environment}-reports-bucket
