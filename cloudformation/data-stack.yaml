AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart data-stack — RDS MySQL database, DynamoDB orders table,
  and S3 buckets for Lambda deployment artifacts and daily reports.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart MySQL database name

  DBMasterUsername:
    Type: String
    NoEcho: true
    Description: RDS master username supplied by GitHub Actions from SSM

  DBMasterUserPassword:
    Type: String
    NoEcho: true
    Description: RDS master password supplied by GitHub Actions from SSM


# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # RDS SUBNET GROUP
  # ==========================================================

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:
      DBSubnetGroupDescription: !Sub
        CloudMart RDS subnet group for ${Environment}

      SubnetIds:
        - Fn::ImportValue:
            !Sub cloudmart-${Environment}-private-subnet-id

        - Fn::ImportValue:
            !Sub cloudmart-${Environment}-private-subnet-2-id

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # RDS MYSQL DATABASE
  # ==========================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-mysql

      Engine: mysql

      EngineVersion: "8.0"

      DBInstanceClass: db.t3.micro

      AllocatedStorage: 20

      MaxAllocatedStorage: 50

      StorageType: gp3

      DBName: !Ref DBName

      MasterUsername: !Ref DBMasterUsername

      MasterUserPassword: !Ref DBMasterUserPassword

      DBSubnetGroupName: !Ref RDSSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue:
            !Sub cloudmart-${Environment}-rds-sg-id

      PubliclyAccessible: false

      MultiAZ: false

      DeletionProtection: false

      StorageEncrypted: true

      BackupRetentionPeriod: 1

      AutoMinorVersionUpgrade: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-mysql

        - Key: Environment
          Value: !Ref Environment

        - Key: Project
          Value: CloudMart


  # ==========================================================
  # DYNAMODB ORDERS TABLE
  # ==========================================================

  OrdersTable:
    Type: AWS::DynamoDB::Table

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

    Properties:

      TableName:
        !Sub cloudmart-${Environment}-orders

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: orderId
          AttributeType: S

        - AttributeName: customerId
          AttributeType: S

        - AttributeName: createdAt
          AttributeType: S

      KeySchema:

        - AttributeName: orderId
          KeyType: HASH

      GlobalSecondaryIndexes:

        - IndexName: CustomerOrdersIndex

          KeySchema:

            - AttributeName: customerId
              KeyType: HASH

            - AttributeName: createdAt
              KeyType: RANGE

          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-orders

        - Key: Environment
          Value: !Ref Environment

        - Key: Project
          Value: CloudMart


  # ==========================================================
  # S3 BUCKET — LAMBDA DEPLOYMENT ARTIFACTS
  # ==========================================================

  ArtifactsBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

    Properties:

      BucketEncryption:
        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-artifacts

        - Key: Purpose
          Value: Lambda deployment packages

        - Key: Environment
          Value: !Ref Environment

        - Key: Project
          Value: CloudMart


  # ==========================================================
  # S3 BUCKET — DAILY REPORTS
  # ==========================================================

  ReportsBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

    Properties:

      BucketEncryption:
        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

        - Key: Purpose
          Value: Daily sales reports

        - Key: Environment
          Value: !Ref Environment

        - Key: Project
          Value: CloudMart


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # RDS ENDPOINT
  # ----------------------------------------------------------

  RDSEndpoint:
    Description: RDS MySQL endpoint address

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Address

    Export:
      Name:
        !Sub cloudmart-${Environment}-rds-endpoint


  # ----------------------------------------------------------
  # RDS INSTANCE IDENTIFIER
  # ----------------------------------------------------------

  RDSInstanceIdentifier:
    Description: RDS MySQL instance identifier

    Value:
      !Ref CloudMartDatabase

    Export:
      Name:
        !Sub cloudmart-${Environment}-rds-instance-id


  # ----------------------------------------------------------
  # RDS PORT
  # ----------------------------------------------------------

  RDSPort:
    Description: RDS MySQL port

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Port

    Export:
      Name:
        !Sub cloudmart-${Environment}-rds-port


  # ----------------------------------------------------------
  # DYNAMODB TABLE
  # ----------------------------------------------------------

  OrdersTableName:
    Description: DynamoDB table storing CloudMart orders

    Value:
      !Ref OrdersTable

    Export:
      Name:
        !Sub cloudmart-${Environment}-orders-table


  # ----------------------------------------------------------
  # S3 ARTIFACTS BUCKET
  # ----------------------------------------------------------

  ArtifactsBucketName:
    Description: S3 bucket for Lambda deployment packages

    Value:
      !Ref ArtifactsBucket

    Export:
      Name:
        !Sub cloudmart-${Environment}-artifacts-bucket


  # ----------------------------------------------------------
  # S3 REPORTS BUCKET
  # ----------------------------------------------------------

  ReportsBucketName:
    Description: S3 bucket for daily CSV reports

    Value:
      !Ref ReportsBucket

    Export:
      Name:
        !Sub cloudmart-${Environment}-reports-bucket
