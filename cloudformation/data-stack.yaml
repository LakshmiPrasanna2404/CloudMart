AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart data-stack — RDS MySQL in the private subnet, and the S3
  bucket for daily reports.
  Imports network resources from network-stack.
  The Lambda deployment artifacts bucket already exists and is reused.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: Free Tier eligible instance class
  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: Storage in GB, Free Tier covers up to 20GB
  DBMasterUsername:
    Type: String
    NoEcho: true
    Description: Passed in at deploy time from SSM — never hardcoded
  DBMasterUserPassword:
    Type: String
    NoEcho: true
    Description: Passed in at deploy time from SSM — never hardcoded
  ArtifactsBucketName:
    Type: String
    Default: cloudmart-artifacts-393476285814
    Description: Existing S3 bucket used for Lambda deployment artifacts

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Private subnets for cloudmart-${Environment} RDS
      SubnetIds:
        - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-id
        - Fn::ImportValue: !Sub cloudmart-${Environment}-private-subnet-2-id
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-db-subnet-group

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub cloudmart-${Environment}-db
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterUserPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub cloudmart-${Environment}-rds-sg-id
      PubliclyAccessible: false
      StorageEncrypted: true
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-db

  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub cloudmart-${Environment}-reports-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

Outputs:
  RDSEndpoint:
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub cloudmart-${Environment}-rds-endpoint
  RDSPort:
    Value: !GetAtt RDSInstance.Endpoint.Port
    Export:
      Name: !Sub cloudmart-${Environment}-rds-port
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucketName
    Export:
      Name: !Sub cloudmart-${Environment}-artifacts-bucket-name
  ReportsBucketName:
    Value: !Ref ReportsBucket
    Export:
      Name: !Sub cloudmart-${Environment}-reports-bucket-name
