<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>CloudMart Admin Login</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: grid;
            place-items: center;

            font-family: Arial, sans-serif;

            background: #f4f6f9;
            color: #172033;
        }

        .login-card {

            width: min(420px, 90%);

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border:
                1px solid #cbd5e1;

            border-radius: 6px;

            margin-bottom: 16px;
        }

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        .error {

            background: #fff0f0;

            color: #9b1c1c;

            border-left:
                5px solid #d33;

            padding: 12px;

            margin-bottom: 16px;
        }

        .muted {

            color: #667085;

            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h1>CloudMart Admin Login</h1>

    <p class="muted">
        Enter the CloudMart production admin token.
    </p>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form
        method="post"
        action="{{ url_for('login') }}"
        autocomplete="off"
    >

        <label for="token">
            Admin Token
        </label>

        <input
            id="token"
            name="token"
            type="password"
            placeholder="Enter admin token"
            required
            autofocus
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>

</html>
