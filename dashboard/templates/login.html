<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudMart Admin Login</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f4f6f9;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .login-card {
            width: min(420px, 90%);
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.10);
        }
        h1 { margin-top: 0; }
        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cfd5df;
            border-radius: 8px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        .error {
            margin-top: 14px;
            padding: 10px;
            border-radius: 8px;
            background: #fff0f0;
            color: #b42318;
        }
        .hint {
            color: #667085;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>CloudMart Admin Login</h1>
        <p class="hint">Enter the admin token stored in AWS Systems Manager Parameter Store.</p>

        <form method="post" action="{{ url_for('login') }}">
            <label for="admin_token">Admin Token</label>
            <input
                id="admin_token"
                name="admin_token"
                type="password"
                autocomplete="current-password"
                required
            >
            <button type="submit">Login</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </main>
</body>
</html>
