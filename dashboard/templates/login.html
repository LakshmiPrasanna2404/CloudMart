<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudMart Admin Login</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f4f6f9;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f6f9;
        }

        .login-card {
            width: min(420px, 90%);
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        .error {
            padding: 10px 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            background: #fee4e2;
            color: #b42318;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>CloudMart Admin</h1>
        <p class="subtitle">Enter the administrator token to access the dashboard.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}">
            <label for="token">Admin Token</label>
            <input
                id="token"
                name="token"
                type="password"
                placeholder="Enter admin token"
                autocomplete="current-password"
                required
                autofocus
            >
            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
