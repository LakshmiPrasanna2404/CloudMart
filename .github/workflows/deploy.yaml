name: CloudMart CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: prod
  EXEC_ROLE: arn:aws:iam::393476285814:role/CloudMartCFNExecutionRole

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cfn-lint
        run: |
          pip install cfn-lint

      - name: Validate CloudFormation templates
        run: |
          set -euo pipefail

          for file in cloudformation/*.yaml; do
            echo "Validating $file"
            cfn-lint "$file"
          done


  # ============================================================
  # AWS CREDENTIALS
  # ============================================================
  configure-aws:
    name: Configure AWS
    runs-on: ubuntu-latest
    outputs:
      account_id: ${{ steps.account.outputs.account_id }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"


  # ============================================================
  # NETWORK
  # ============================================================
  deploy-network:
    name: Deploy Network Stack
    needs:
      - lint
      - configure-aws

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}


  # ============================================================
  # DATA
  # ============================================================
  deploy-data:
    name: Deploy Data Stack
    needs:
      - deploy-network
      - configure-aws

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy data stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}


  # ============================================================
  # IAM
  # ============================================================
  deploy-iam:
    name: Deploy IAM Stack
    needs:
      - deploy-network
      - deploy-data
      - configure-aws

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}


  # ============================================================
  # APPLICATION
  # ============================================================
  deploy-app:
    name: Deploy Application Stack
    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - configure-aws

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/app-stack.yaml \
            --stack-name cloudmart-app \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}


  # ============================================================
  # REPORT
  # ============================================================
  deploy-report:
    name: Deploy Report Stack
    needs:
      - deploy-app
      - deploy-data
      - deploy-iam
      - configure-aws

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy report stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/report-stack.yaml \
            --stack-name cloudmart-report \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}


  # ============================================================
  # MONITORING
  # ============================================================
  deploy-monitoring:
    name: Deploy Monitoring Stack
    needs:
      - deploy-app
      - deploy-report
      - deploy-iam
      - configure-aws

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy monitoring stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/monitoring-stack.yaml \
            --stack-name cloudmart-monitoring \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}


  # ============================================================
  # APPLY DATABASE SCHEMA
  # ============================================================
  apply-schema:
    name: Apply Database Schema
    needs:
      - deploy-app
      - deploy-data

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke schema Lambda
        run: |
          aws lambda invoke \
            --function-name cloudmart-prod-apply-schema \
            --region ${{ env.AWS_REGION }} \
            /tmp/schema-response.json

          cat /tmp/schema-response.json


  # ============================================================
  # DASHBOARD
  # ============================================================
  deploy-dashboard:
    name: Deploy EC2 Flask dashboard
    needs:
      - deploy-app
      - deploy-report
      - deploy-monitoring

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS CREDENTIALS
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.EXEC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # ACCOUNT / BUCKET
      # --------------------------------------------------------
      - name: Get dashboard artifact bucket
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "ARTIFACTS_BUCKET=cloudmart-artifacts-${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # PACKAGE DASHBOARD
      # --------------------------------------------------------
      - name: Package dashboard
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/dashboard-package

          cp -r dashboard/* /tmp/dashboard-package/

          cd /tmp/dashboard-package

          zip -qr /tmp/dashboard.zip .


      # --------------------------------------------------------
      # UPLOAD DASHBOARD ZIP
      # --------------------------------------------------------
      - name: Upload dashboard artifact
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            /tmp/dashboard.zip \
            "s3://${ARTIFACTS_BUCKET}/dashboard/dashboard.zip" \
            --region "$AWS_REGION"

          echo "Dashboard artifact uploaded successfully."


      # --------------------------------------------------------
      # CREATE EC2 DEPLOYMENT SCRIPT
      # --------------------------------------------------------
      - name: Create dashboard deployment script
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/deploy-dashboard-on-ec2.sh <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          APP_DIR="/opt/cloudmart-dashboard"
          REGION="us-east-1"
          ARTIFACTS_BUCKET="cloudmart-artifacts-393476285814"

          echo "=========================================="
          echo "CloudMart Dashboard Deployment"
          echo "=========================================="

          echo "Installing required OS packages..."

          if command -v dnf >/dev/null 2>&1; then

              dnf install -y python3 unzip awscli

          elif command -v yum >/dev/null 2>&1; then

              yum install -y python3 unzip awscli

          elif command -v apt-get >/dev/null 2>&1; then

              export DEBIAN_FRONTEND=noninteractive

              apt-get update -y

              apt-get install -y python3 unzip awscli

          else

              echo "No supported package manager found"
              exit 1

          fi


          echo "Creating application directory..."

          mkdir -p "$APP_DIR"


          echo "Downloading dashboard artifact..."

          aws s3 cp \
              "s3://${ARTIFACTS_BUCKET}/dashboard/dashboard.zip" \
              /tmp/dashboard.zip \
              --region "$REGION"


          echo "Cleaning previous dashboard files..."

          rm -rf "${APP_DIR:?}"/*


          echo "Extracting dashboard..."

          unzip -oq \
              /tmp/dashboard.zip \
              -d "$APP_DIR"


          echo "Checking dashboard files..."

          test -f "$APP_DIR/app.py"

          test -d "$APP_DIR/vendor"


          echo "Dashboard files verified."


          echo "Reading database configuration from SSM..."

          DB_HOST=$(aws ssm get-parameter \
              --name "/cloudmart/prod/db/host" \
              --with-decryption \
              --region "$REGION" \
              --query "Parameter.Value" \
              --output text)

          DB_NAME=$(aws ssm get-parameter \
              --name "/cloudmart/prod/db/name" \
              --with-decryption \
              --region "$REGION" \
              --query "Parameter.Value" \
              --output text)

          DB_USERNAME=$(aws ssm get-parameter \
              --name "/cloudmart/prod/db/username" \
              --with-decryption \
              --region "$REGION" \
              --query "Parameter.Value" \
              --output text)

          DB_PASSWORD=$(aws ssm get-parameter \
              --name "/cloudmart/prod/db/password" \
              --with-decryption \
              --region "$REGION" \
              --query "Parameter.Value" \
              --output text)


          echo "Creating dashboard environment file..."

          cat > /etc/cloudmart-dashboard.env <<EOF
          DB_HOST=${DB_HOST}
          DB_NAME=${DB_NAME}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          AWS_REGION=${REGION}
          ARTIFACTS_BUCKET=${ARTIFACTS_BUCKET}
          EOF

          chmod 600 /etc/cloudmart-dashboard.env


          echo "Creating dashboard systemd service..."

          cat > /etc/systemd/system/cloudmart-dashboard.service <<EOF
          [Unit]
          Description=CloudMart Flask Dashboard
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=${APP_DIR}
          EnvironmentFile=/etc/cloudmart-dashboard.env
          Environment="PYTHONPATH=${APP_DIR}/vendor"
          ExecStart=/usr/bin/python3 -m gunicorn --workers 2 --bind 0.0.0.0:80 app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF


          echo "Reloading systemd..."

          systemctl daemon-reload


          echo "Enabling dashboard service..."

          systemctl enable cloudmart-dashboard


          echo "Restarting dashboard service..."

          systemctl restart cloudmart-dashboard


          echo "Waiting for dashboard service..."

          sleep 5


          echo "Checking dashboard service..."

          systemctl --no-pager status cloudmart-dashboard


          echo "Testing local dashboard..."

          curl -I http://127.0.0.1/ || true


          echo "=========================================="
          echo "CloudMart Dashboard Deployment Complete"
          echo "=========================================="
          SCRIPT

          chmod +x /tmp/deploy-dashboard-on-ec2.sh


      # --------------------------------------------------------
      # BASE64 DEPLOYMENT SCRIPT
      # --------------------------------------------------------
      - name: Encode dashboard deployment script
        shell: bash
        run: |
          set -euo pipefail

          base64 -w 0 \
            /tmp/deploy-dashboard-on-ec2.sh \
            > deploy-dashboard-on-ec2.b64


      # --------------------------------------------------------
      # DEPLOY THROUGH SSM
      # --------------------------------------------------------
      - name: Deploy dashboard through SSM
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_B64=$(cat deploy-dashboard-on-ec2.b64)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0e17d466382559abd \
            --document-name AWS-RunShellScript \
            --comment "Deploy CloudMart Flask dashboard" \
            --parameters "commands=[\"echo $SCRIPT_B64 | base64 -d > /tmp/deploy-dashboard-on-ec2.sh\", \"chmod +x /tmp/deploy-dashboard-on-ec2.sh\", \"sudo bash /tmp/deploy-dashboard-on-ec2.sh\"]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"


          for attempt in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0e17d466382559abd \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Attempt $attempt: $STATUS"


            case "$STATUS" in

              Success)

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0e17d466382559abd \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;


              Failed|Cancelled|TimedOut|Cancelling)

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0e17d466382559abd \
                  --region "$AWS_REGION" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text

                exit 1
                ;;

            esac

            sleep 10

          done


          echo "Timed out waiting for SSM deployment"

          exit 1
