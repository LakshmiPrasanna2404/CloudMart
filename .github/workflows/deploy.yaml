name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'cloudformation/network-stack.yaml'
      - 'cloudformation/data-stack.yaml'
      - 'cloudformation/iam-stack.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EXEC_ROLE: ${{ vars.CFN_EXEC_ROLE_ARN }}

jobs:
  deploy-network:
    name: Deploy network-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network \
            --parameter-overrides Environment=prod \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network \
            --query 'Stacks[0].Outputs[*].{Key:OutputKey,Value:OutputValue}' \
            --output table

  deploy-data:
    name: Deploy data-stack
    runs-on: ubuntu-latest
    needs: deploy-network
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch DB credentials from SSM
        id: dbcreds
        run: |
          USERNAME=$(aws ssm get-parameter --name /cloudmart/prod/db/username --with-decryption --query 'Parameter.Value' --output text)
          PASSWORD=$(aws ssm get-parameter --name /cloudmart/prod/db/password --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Deploy data-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data \
            --parameter-overrides \
              Environment=prod \
              DBMasterUsername='${{ steps.dbcreds.outputs.username }}' \
              DBMasterUserPassword='${{ steps.dbcreds.outputs.password }}' \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query 'Stacks[0].Outputs[*].{Key:OutputKey,Value:OutputValue}' \
            --output table

  deploy-iam:
    name: Deploy iam-stack
    runs-on: ubuntu-latest
    needs: deploy-data
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy iam-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam \
            --parameter-overrides Environment=prod \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam \
            --query 'Stacks[0].Outputs[*].{Key:OutputKey,Value:OutputValue}' \
            --output table

  deploy-test-lambda:
    name: Deploy and run RDS connectivity test
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda with dependencies
        run: |
          cd lambdas/test-rds-connection
          pip install pymysql -t . --quiet
          zip -r ../../test-rds-connection.zip . -x "*.pyc"
          cd ../..

      - name: Upload package to S3
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)
          aws s3 cp test-rds-connection.zip "s3://${ARTIFACTS_BUCKET}/lambdas/test-rds-connection.zip"

      - name: Deploy test-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/test-stack.yaml \
            --stack-name cloudmart-test \
            --parameter-overrides Environment=prod \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Invoke the test Lambda
        run: |
          aws lambda invoke \
            --function-name cloudmart-prod-test-rds-connection \
            --payload '{}' \
            response.json
          cat response.json

      - name: Fetch recent CloudWatch logs
        run: |
          sleep 5
          aws logs tail /aws/lambda/cloudmart-prod-test-rds-connection --since 2m
