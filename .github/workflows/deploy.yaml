name: Deploy CloudMart

on:
  push:
    branches: [main]
    paths:
      - 'cloudformation/**'
      - 'lambdas/**'
      - '.github/workflows/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EXEC_ROLE: ${{ vars.CFN_EXEC_ROLE_ARN }}

jobs:

  # ═══════════════════════════════════════════
  # 0. LINT — validates CloudFormation templates, gates every stack deploy
  # ═══════════════════════════════════════════
  lint:
    name: Lint CloudFormation templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install cfn-lint --quiet

      - name: Run cfn-lint on all templates
        run: cfn-lint cloudformation/*.yaml --ignore-checks W1011

  # ═══════════════════════════════════════════
  # 1. NETWORK
  # ═══════════════════════════════════════════
  deploy-network:
    name: Deploy network-stack
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network \
            --parameter-overrides Environment=prod \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ═══════════════════════════════════════════
  # 2. DATA
  # ═══════════════════════════════════════════
  deploy-data:
    name: Deploy data-stack
    runs-on: ubuntu-latest
    needs: deploy-network
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch DB credentials from SSM
        id: dbcreds
        run: |
          USERNAME=$(aws ssm get-parameter --name /cloudmart/prod/db/username --with-decryption --query 'Parameter.Value' --output text)
          PASSWORD=$(aws ssm get-parameter --name /cloudmart/prod/db/password --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Create RBAC tokens in SSM Parameter Store if missing
        run: |
          set -euo pipefail

          create_parameter() {
            local name="$1"
            local description="$2"

            if aws ssm get-parameter --name "$name" >/dev/null 2>&1; then
              echo "Already exists: $name"
            else
              TOKEN=$(openssl rand -hex 32)
              aws ssm put-parameter \
                --name "$name" \
                --type SecureString \
                --value "$TOKEN" \
                --tier Standard \
                --description "$description"
              echo "Created: $name"
            fi
          }

          create_parameter \
            "/cloudmart/prod/auth/admin-token" \
            "CloudMart production admin RBAC token"

          create_parameter \
            "/cloudmart/prod/auth/products-token" \
            "CloudMart production products RBAC token"

          create_parameter \
            "/cloudmart/prod/auth/orders-token" \
            "CloudMart production orders/customer RBAC token"

      - name: Verify RBAC SSM parameters
        run: |
          set -euo pipefail

          for name in \
            /cloudmart/prod/auth/admin-token \
            /cloudmart/prod/auth/products-token \
            /cloudmart/prod/auth/orders-token
          do
            aws ssm get-parameter --name "$name" >/dev/null
            echo "Verified: $name"
          done

      - name: Deploy data-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data \
            --parameter-overrides \
              Environment=prod \
              DBMasterUsername='${{ steps.dbcreds.outputs.username }}' \
              DBMasterUserPassword='${{ steps.dbcreds.outputs.password }}' \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ═══════════════════════════════════════════
  # 3. IAM
  # ═══════════════════════════════════════════
  deploy-iam:
    name: Deploy iam-stack
    runs-on: ubuntu-latest
    needs: deploy-data
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy iam-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam \
            --parameter-overrides Environment=prod \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ═══════════════════════════════════════════
  # 4. APPLICATION — package, upload, deploy, force code update
  # ═══════════════════════════════════════════
  deploy-app:
    name: Package and deploy app-stack
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambdas with dependencies
        run: |
          for name in authorizer product order apply-schema; do
            cd lambdas/$name
            pip install pymysql -t . --quiet 2>/dev/null || true
            zip -r "../../${name}.zip" . -x "*.pyc"
            cd ../..
          done

      - name: Upload packages to S3
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)
          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> "$GITHUB_ENV"
          aws s3 cp authorizer.zip "s3://${ARTIFACTS_BUCKET}/lambdas/authorizer.zip"
          aws s3 cp product.zip "s3://${ARTIFACTS_BUCKET}/lambdas/product.zip"
          aws s3 cp order.zip "s3://${ARTIFACTS_BUCKET}/lambdas/order.zip"
          aws s3 cp apply-schema.zip "s3://${ARTIFACTS_BUCKET}/lambdas/apply-schema.zip"

      - name: Deploy app-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/app-stack.yaml \
            --stack-name cloudmart-app \
            --parameter-overrides \
              Environment=prod \
              AlertEmail="${{ vars.ALERT_EMAIL }}" \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # CloudFormation only updates a Lambda's code when the S3Key string
      # itself changes. Since it stays the same every deploy, force the
      # update explicitly here so code changes always actually take effect.
      - name: Force Lambda code updates
        run: |
          for fn in authorizer product order apply-schema; do
            aws lambda update-function-code \
              --function-name cloudmart-prod-$fn \
              --s3-bucket "$ARTIFACTS_BUCKET" --s3-key lambdas/$fn.zip --publish
            aws lambda wait function-updated --function-name cloudmart-prod-$fn
          done

  # ═══════════════════════════════════════════
  # 5. APPLY SCHEMA
  # ═══════════════════════════════════════════
  apply-schema:
    name: Apply RDS schema and sample data
    runs-on: ubuntu-latest
    needs: deploy-app
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke apply-schema Lambda
        run: |
          aws lambda invoke \
            --function-name cloudmart-prod-apply-schema \
            --payload '{}' \
            response.json
          cat response.json

  # ═══════════════════════════════════════════
  # 6. VERIFY AUTH — 401 / 401 / 200 / 403
  # ═══════════════════════════════════════════
  verify-auth:
    name: Verify 401 / 401 / 200 / 403 auth flow
    runs-on: ubuntu-latest
    needs: apply-schema
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Authorizer Function URL
        id: geturl
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-app \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerFunctionUrl'].OutputValue" \
            --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify RBAC SSM parameters exist
        run: |
          set -euo pipefail
          for name in \
            /cloudmart/prod/auth/admin-token \
            /cloudmart/prod/auth/products-token \
            /cloudmart/prod/auth/orders-token
          do
            aws ssm get-parameter --name "$name" >/dev/null
            echo "Found: $name"
          done

      - name: No token -> expect 401
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ steps.geturl.outputs.url }}products")
          echo "No-token status: $STATUS"
          [ "$STATUS" = "401" ] && echo "PASS" || (echo "FAIL" && exit 1)

      - name: Wrong token -> expect 401
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer wrong-token-value" \
            "${{ steps.geturl.outputs.url }}products")
          echo "Wrong-token status: $STATUS"
          [ "$STATUS" = "401" ] && echo "PASS" || (echo "FAIL" && exit 1)

      - name: Fetch admin token from SSM
        id: admintoken
        run: |
          TOKEN=$(aws ssm get-parameter \
            --name /cloudmart/prod/auth/admin-token \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Admin token -> expect 200
        env:
          REAL_TOKEN: ${{ steps.admintoken.outputs.token }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $REAL_TOKEN" \
            "${{ steps.geturl.outputs.url }}products")
          echo "Admin-token status: $STATUS"
          [ "$STATUS" = "200" ] && echo "PASS" || (echo "FAIL" && exit 1)

      - name: Fetch orders token from SSM
        id: orderstoken
        run: |
          TOKEN=$(aws ssm get-parameter \
            --name /cloudmart/prod/auth/orders-token \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Orders token cannot create products -> expect 403
        env:
          ORDERS_TOKEN: ${{ steps.orderstoken.outputs.token }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $ORDERS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ steps.geturl.outputs.url }}products")
          echo "Orders-token POST /products status: $STATUS"
          [ "$STATUS" = "403" ] && echo "PASS" || (echo "FAIL" && exit 1)

      - name: RBAC verification complete
        run: |
          echo "========================================"
          echo "CloudMart RBAC verification PASSED"
          echo "========================================"
          echo "Missing token          -> 401 PASS"
          echo "Invalid token          -> 401 PASS"
          echo "Admin token            -> 200 PASS"
          echo "Orders POST /products  -> 403 PASS"
