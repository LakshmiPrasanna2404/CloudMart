name: Deploy CloudMart

on:
  push:
    branches: [main]
    paths:
      - 'cloudformation/**'
      - 'lambdas/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EXEC_ROLE: ${{ vars.CFN_EXEC_ROLE_ARN }}

jobs:

  # ═══════════════════════════════════════════
  # 0. LINT — gates app deployment, runs independently of the AWS stacks
  # ═══════════════════════════════════════════
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8 --quiet

      - name: Run flake8
        run: flake8 lambdas/ --max-line-length=120 --extend-ignore=E501,W503

  # ═══════════════════════════════════════════
  # 1. NETWORK
  # ═══════════════════════════════════════════
  deploy-network:
    name: Deploy network-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network \
            --parameter-overrides Environment=prod \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ═══════════════════════════════════════════
  # 2. DATA
  # ═══════════════════════════════════════════
  deploy-data:
    name: Deploy data-stack
    runs-on: ubuntu-latest
    needs: deploy-network
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch DB credentials from SSM
        id: dbcreds
        run: |
          USERNAME=$(aws ssm get-parameter --name /cloudmart/prod/db/username --with-decryption --query 'Parameter.Value' --output text)
          PASSWORD=$(aws ssm get-parameter --name /cloudmart/prod/db/password --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Deploy data-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data \
            --parameter-overrides \
              Environment=prod \
              DBMasterUsername='${{ steps.dbcreds.outputs.username }}' \
              DBMasterUserPassword='${{ steps.dbcreds.outputs.password }}' \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ═══════════════════════════════════════════
  # 3. IAM
  # ═══════════════════════════════════════════
  deploy-iam:
    name: Deploy iam-stack
    runs-on: ubuntu-latest
    needs: deploy-data
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy iam-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam \
            --parameter-overrides Environment=prod \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ═══════════════════════════════════════════
  # 4. APPLICATION — package, upload, deploy, force code update
  # ═══════════════════════════════════════════
  deploy-app:
    name: Package and deploy app-stack
    runs-on: ubuntu-latest
    needs: [deploy-iam, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambdas with dependencies
        run: |
          for name in authorizer product apply-schema; do
            cd lambdas/$name
            pip install pymysql -t . --quiet 2>/dev/null || true
            zip -r "../../${name}.zip" . -x "*.pyc"
            cd ../..
          done

      - name: Upload packages to S3
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)
          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> "$GITHUB_ENV"
          aws s3 cp authorizer.zip "s3://${ARTIFACTS_BUCKET}/lambdas/authorizer.zip"
          aws s3 cp product.zip "s3://${ARTIFACTS_BUCKET}/lambdas/product.zip"
          aws s3 cp apply-schema.zip "s3://${ARTIFACTS_BUCKET}/lambdas/apply-schema.zip"

      - name: Deploy app-stack via Change Set
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/app-stack.yaml \
            --stack-name cloudmart-app \
            --parameter-overrides Environment=prod AlertEmail=${{ vars.ALERT_EMAIL }} \
            --role-arn ${{ env.EXEC_ROLE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # CloudFormation only updates a Lambda's code when the S3Key string
      # itself changes. Since it stays the same every deploy, force the
      # update explicitly here so code changes always actually take effect.
      - name: Force Lambda code updates
        run: |
          aws lambda update-function-code \
            --function-name cloudmart-prod-authorizer \
            --s3-bucket "$ARTIFACTS_BUCKET" --s3-key lambdas/authorizer.zip --publish
          aws lambda wait function-updated --function-name cloudmart-prod-authorizer

          aws lambda update-function-code \
            --function-name cloudmart-prod-product \
            --s3-bucket "$ARTIFACTS_BUCKET" --s3-key lambdas/product.zip --publish
          aws lambda wait function-updated --function-name cloudmart-prod-product

          aws lambda update-function-code \
            --function-name cloudmart-prod-apply-schema \
            --s3-bucket "$ARTIFACTS_BUCKET" --s3-key lambdas/apply-schema.zip --publish
          aws lambda wait function-updated --function-name cloudmart-prod-apply-schema

  # ═══════════════════════════════════════════
  # 5. APPLY SCHEMA
  # ═══════════════════════════════════════════
  apply-schema:
    name: Apply RDS schema and sample data
    runs-on: ubuntu-latest
    needs: deploy-app
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke apply-schema Lambda
        run: |
          aws lambda invoke \
            --function-name cloudmart-prod-apply-schema \
            --payload '{}' \
            response.json
          cat response.json

  # ═══════════════════════════════════════════
  # 6. VERIFY AUTH — 401 / 401 / 200
  # ═══════════════════════════════════════════
  verify-auth:
    name: Verify 401 / 401 / 200 auth flow
    runs-on: ubuntu-latest
    needs: apply-schema
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Authorizer Function URL
        id: geturl
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-app \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerFunctionUrl'].OutputValue" \
            --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: No token -> expect 401
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.geturl.outputs.url }}products")
          echo "No-token status: $STATUS"
          [ "$STATUS" = "401" ] && echo "PASS" || (echo "FAIL" && exit 1)

      - name: Wrong token -> expect 401
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer wrong-token-value" \
            "${{ steps.geturl.outputs.url }}products")
          echo "Wrong-token status: $STATUS"
          [ "$STATUS" = "401" ] && echo "PASS" || (echo "FAIL" && exit 1)

      - name: Correct token -> expect 200
        env:
          REAL_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $REAL_TOKEN" \
            "${{ steps.geturl.outputs.url }}products")
          echo "Correct-token status: $STATUS"
          [ "$STATUS" = "200" ] && echo "PASS" || (echo "FAIL" && exit 1)
