name: Deploy CloudMart

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/**'
      - 'lambdas/**'
      - '.github/workflows/**'
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EXEC_ROLE: ${{ vars.CFN_EXEC_ROLE_ARN }}

jobs:
  # ============================================================
  # 0. LINT CLOUDFORMATION TEMPLATES
  # ============================================================
  lint:
    name: Lint CloudFormation templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: python -m pip install cfn-lint --quiet

      - name: Validate CloudFormation templates
        run: cfn-lint cloudformation/*.yaml --ignore-checks W1011

  # ============================================================
  # 1. NETWORK STACK
  # ============================================================
  deploy-network:
    name: Deploy network-stack
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network-stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network \
            --parameter-overrides Environment=prod \
            --role-arn "$EXEC_ROLE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ============================================================
  # 2. DATA STACK
  # Existing DB credentials and RBAC tokens are read from SSM.
  # This workflow does not create or overwrite authentication tokens.
  # ============================================================
  deploy-data:
    name: Deploy data-stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch database credentials from SSM
        id: dbcreds
        shell: bash
        run: |
          set -euo pipefail

          USERNAME=$(aws ssm get-parameter \
            --name "/cloudmart/prod/db/username" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)

          PASSWORD=$(aws ssm get-parameter \
            --name "/cloudmart/prod/db/password" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)

          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Verify existing RBAC SSM parameters
        shell: bash
        run: |
          set -euo pipefail

          aws ssm get-parameter \
            --name "/cloudmart/prod/auth/admin-token" \
            >/dev/null
          echo "Verified: /cloudmart/prod/auth/admin-token"

          aws ssm get-parameter \
            --name "/cloudmart/prod/auth/products-token" \
            >/dev/null
          echo "Verified: /cloudmart/prod/auth/products-token"

      - name: Deploy data-stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data \
            --parameter-overrides \
              Environment=prod \
              DBMasterUsername="${{ steps.dbcreds.outputs.username }}" \
              DBMasterUserPassword="${{ steps.dbcreds.outputs.password }}" \
            --role-arn "$EXEC_ROLE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ============================================================
  # 3. IAM STACK
  # ============================================================
  deploy-iam:
    name: Deploy iam-stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy iam-stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam \
            --parameter-overrides Environment=prod \
            --role-arn "$EXEC_ROLE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ============================================================
  # 4. APPLICATION STACK
  # ============================================================
  deploy-app:
    name: Package and deploy app-stack
    runs-on: ubuntu-latest
    needs: deploy-iam

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda functions with dependencies
        shell: bash
        run: |
          set -euo pipefail

          for name in authorizer product order apply-schema; do
            echo "Packaging $name"
            rm -f "${name}.zip"

            pushd "lambdas/$name" >/dev/null
            python -m pip install pymysql bcrypt -t . --quiet
            zip -r "../../${name}.zip" . -x '*.pyc' '*__pycache__*'
            popd >/dev/null
          done

      - name: Upload Lambda packages to S3
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACTS_BUCKET" ] || [ "$ARTIFACTS_BUCKET" = "None" ]; then
            echo "Artifacts bucket was not found"
            exit 1
          fi

          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> "$GITHUB_ENV"

          aws s3 cp authorizer.zip "s3://${ARTIFACTS_BUCKET}/lambdas/authorizer.zip"
          aws s3 cp product.zip "s3://${ARTIFACTS_BUCKET}/lambdas/product.zip"
          aws s3 cp order.zip "s3://${ARTIFACTS_BUCKET}/lambdas/order.zip"
          aws s3 cp apply-schema.zip "s3://${ARTIFACTS_BUCKET}/lambdas/apply-schema.zip"

      - name: Deploy app-stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file cloudformation/app-stack.yaml \
            --stack-name cloudmart-app \
            --parameter-overrides \
              Environment=prod \
              AlertEmail="${{ vars.ALERT_EMAIL }}" \
            --role-arn "$EXEC_ROLE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Force Lambda code updates
        shell: bash
        run: |
          set -euo pipefail

          for fn in authorizer product order apply-schema; do
            echo "Updating Lambda code: cloudmart-prod-$fn"

            aws lambda update-function-code \
              --function-name "cloudmart-prod-$fn" \
              --s3-bucket "$ARTIFACTS_BUCKET" \
              --s3-key "lambdas/$fn.zip" \
              --publish

            aws lambda wait function-updated \
              --function-name "cloudmart-prod-$fn"
          done

  # ============================================================
  # 5. REPORT LAMBDA + MONITORING
  # ============================================================
  deploy-report-and-monitoring:
    name: Deploy report Lambda and monitoring
    runs-on: ubuntu-latest
    needs: deploy-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CloudFormation outputs
        id: outputs
        shell: bash
        run: |
          set -euo pipefail

          REPORT_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam \
            --query "Stacks[0].Outputs[?OutputKey=='ReportRoleArn'].OutputValue" \
            --output text)

          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='RDSEndpoint'].OutputValue | [0]" \
            --output text)

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "A DB endpoint output was not found in cloudmart-data."
            echo "Add a DB endpoint output to data-stack.yaml, or grant rds:DescribeDBInstances to the GitHub OIDC role."
            exit 1
          fi

          if [ -z "$REPORT_ROLE_ARN" ] || [ "$REPORT_ROLE_ARN" = "None" ]; then
            echo "ReportRoleArn was not found in cloudmart-iam"
            exit 1
          fi

          if [ -z "$ARTIFACTS_BUCKET" ] || [ "$ARTIFACTS_BUCKET" = "None" ]; then
            echo "ArtifactsBucketName was not found in cloudmart-data"
            exit 1
          fi

          if [ -z "$REPORTS_BUCKET" ] || [ "$REPORTS_BUCKET" = "None" ]; then
            echo "ReportsBucketName was not found in cloudmart-data"
            exit 1
          fi

          echo "report_role_arn=$REPORT_ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "artifacts_bucket=$ARTIFACTS_BUCKET" >> "$GITHUB_OUTPUT"
          echo "reports_bucket=$REPORTS_BUCKET" >> "$GITHUB_OUTPUT"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"

      - name: Package report Lambda
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/report-generate
          mkdir -p build/report-generate

          cp lambdas/report-generate/handler.py build/report-generate/

          python -m pip install \
            PyMySQL==1.1.1 \
            -t build/report-generate \
            --quiet

          cd build/report-generate
          zip -r ../../report-generate.zip . -x '*.pyc' '*__pycache__*'
          cd ../..

      - name: Upload report Lambda package
        run: |
          aws s3 cp \
            report-generate.zip \
            "s3://${{ steps.outputs.outputs.artifacts_bucket }}/lambdas/report-generate.zip"

      - name: Deploy report-stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file cloudformation/report-stack.yaml \
            --stack-name cloudmart-report \
            --parameter-overrides \
              Environment=prod \
              ReportLambdaRoleArn="${{ steps.outputs.outputs.report_role_arn }}" \
              DBHost="${{ steps.outputs.outputs.db_host }}" \
              ReportsBucketName="${{ steps.outputs.outputs.reports_bucket }}" \
              DBUsernameParameter="/cloudmart/prod/db/username" \
              DBPasswordParameter="/cloudmart/prod/db/password" \
              ArtifactBucketName="${{ steps.outputs.outputs.artifacts_bucket }}" \
              ArtifactKey="lambdas/report-generate.zip" \
            --role-arn "$EXEC_ROLE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Force report Lambda code update
        run: |
          set -euo pipefail

          aws lambda update-function-code \
            --function-name cloudmart-prod-report-generate \
            --s3-bucket "${{ steps.outputs.outputs.artifacts_bucket }}" \
            --s3-key "lambdas/report-generate.zip" \
            --publish

          aws lambda wait function-updated \
            --function-name cloudmart-prod-report-generate

      - name: Deploy monitoring-stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file cloudformation/monitoring-stack.yaml \
            --stack-name cloudmart-monitoring \
            --parameter-overrides \
              Environment=prod \
              AlertEmail="${{ vars.ALERT_EMAIL }}" \
              DBInstanceIdentifier=cloudmart-prod-db \
            --role-arn "$EXEC_ROLE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify report Lambda
        run: |
          aws lambda get-function \
            --function-name cloudmart-prod-report-generate \
            --query "Configuration.[FunctionName,State,Runtime]" \
            --output table

      - name: Verify monitoring stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-monitoring \
            --query "Stacks[0].StackStatus" \
            --output text

  # ============================================================
  # 6. APPLY DATABASE SCHEMA
  # ============================================================
  apply-schema:
    name: Apply RDS schema and sample data
    runs-on: ubuntu-latest
    needs: deploy-app

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke apply-schema Lambda
        shell: bash
        run: |
          set -euo pipefail

          aws lambda invoke \
            --function-name cloudmart-prod-apply-schema \
            --payload '{}' \
            response.json

          cat response.json

  # ============================================================
  # 7. VERIFY AUTHENTICATION AND RBAC
  # ============================================================
  verify-auth:
    name: Verify 401 / 401 / 200 / 200 auth flow
    runs-on: ubuntu-latest
    needs:
      - apply-schema
      - deploy-report-and-monitoring

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Authorizer Function URL
        id: geturl
        shell: bash
        run: |
          set -euo pipefail

          URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-app \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerFunctionUrl'].OutputValue" \
            --output text)

          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "Authorizer Function URL was not found"
            exit 1
          fi

          case "$URL" in
            */) ;;
            *) URL="${URL}/" ;;
          esac

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Authorizer URL retrieved"

      - name: Verify RBAC SSM parameters exist
        shell: bash
        run: |
          set -euo pipefail

          aws ssm get-parameter \
            --name "/cloudmart/prod/auth/admin-token" \
            >/dev/null
          echo "Found: /cloudmart/prod/auth/admin-token"

          aws ssm get-parameter \
            --name "/cloudmart/prod/auth/products-token" \
            >/dev/null
          echo "Found: /cloudmart/prod/auth/products-token"

          echo "RBAC SSM parameter verification complete"

      - name: No token returns 401
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ steps.geturl.outputs.url }}products")

          echo "No-token status: $STATUS"
          [ "$STATUS" = "401" ]

      - name: Wrong token returns 401
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer wrong-token-value" \
            "${{ steps.geturl.outputs.url }}products")

          echo "Wrong-token status: $STATUS"
          [ "$STATUS" = "401" ]

      - name: Fetch admin token from SSM
        id: admintoken
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(aws ssm get-parameter \
            --name "/cloudmart/prod/auth/admin-token" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "Admin token was empty"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Admin token returns 200
        env:
          REAL_TOKEN: ${{ steps.admintoken.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $REAL_TOKEN" \
            "${{ steps.geturl.outputs.url }}products")

          echo "Admin-token status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Fetch products token from SSM
        id: productstoken
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(aws ssm get-parameter \
            --name "/cloudmart/prod/auth/products-token" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "Products token was empty"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Products token returns 200 for GET products
        env:
          PRODUCTS_TOKEN: ${{ steps.productstoken.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $PRODUCTS_TOKEN" \
            "${{ steps.geturl.outputs.url }}products")

          echo "Products-token GET /products status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: RBAC verification complete
        run: |
          echo "========================================"
          echo "CloudMart RBAC verification PASSED"
          echo "========================================"
          echo "Missing token              -> 401 PASS"
          echo "Invalid token              -> 401 PASS"
          echo "Admin token                -> 200 PASS"
          echo "Products token GET /products -> 200 PASS"

  # ============================================================
  # 8. DEPLOY FLASK DASHBOARD TO EC2 THROUGH SSM
  # ============================================================
  deploy-dashboard:
    name: Deploy EC2 Flask dashboard
    runs-on: ubuntu-latest
    needs: verify-auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get deployment values
        id: values
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data \
            --query "Stacks[0].Outputs[?OutputKey=='RDSEndpoint'].OutputValue | [0]" \
            --output text)

          echo "artifacts_bucket=$ARTIFACTS_BUCKET" >> "$GITHUB_OUTPUT"
          echo "reports_bucket=$REPORTS_BUCKET" >> "$GITHUB_OUTPUT"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"

      - name: Install dashboard dependencies on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          test -f dashboard/requirements.txt

          rm -rf dashboard/vendor
          python3 -m pip install \
            -r dashboard/requirements.txt \
            -t dashboard/vendor \
            --quiet

      - name: Package dashboard with dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f dashboard/app.py
          test -f dashboard/requirements.txt
          test -f dashboard/templates/index.html
          test -d dashboard/vendor

          rm -f dashboard.zip
          cd dashboard
          zip -r ../dashboard.zip . -x '*.pyc' '*__pycache__*'
          cd ..

      - name: Upload dashboard package
        run: |
          aws s3 cp dashboard.zip \
            "s3://${{ steps.values.outputs.artifacts_bucket }}/dashboard/dashboard.zip"

      - name: Create EC2 deployment script
        shell: bash
        run: |
          set -euo pipefail

          cat > deploy-dashboard-on-ec2.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          REGION="__AWS_REGION__"
          ARTIFACTS_BUCKET="__ARTIFACTS_BUCKET__"
          REPORTS_BUCKET="__REPORTS_BUCKET__"
          DB_HOST="__DB_HOST__"
          APP_DIR="/opt/cloudmart-dashboard"

          echo "[1/10] Checking required EC2 commands"
          command -v python3 >/dev/null 2>&1 || { echo "python3 is required but was not found"; exit 1; }
          command -v unzip >/dev/null 2>&1 || { echo "unzip is required but was not found"; exit 1; }
          command -v aws >/dev/null 2>&1 || { echo "aws CLI is required but was not found"; exit 1; }

          echo "[2/10] Preparing dashboard directory"
          mkdir -p "$APP_DIR"

          echo "[3/10] Downloading dashboard package from S3"
          aws s3 cp "s3://${ARTIFACTS_BUCKET}/dashboard/dashboard.zip" /tmp/dashboard.zip --region "$REGION"

          echo "[4/10] Extracting dashboard package"
          rm -rf "${APP_DIR:?}"/*
          unzip -oq /tmp/dashboard.zip -d "$APP_DIR"

          test -d "$APP_DIR/vendor" || { echo "dashboard/vendor was not found in package"; exit 1; }
          test -f "$APP_DIR/app.py" || { echo "dashboard/app.py was not found"; exit 1; }

          echo "[5/10] Reading database credentials from SSM"
          DB_USER=$(aws ssm get-parameter \
            --name "/cloudmart/prod/db/username" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region "$REGION")

          DB_PASSWORD=$(aws ssm get-parameter \
            --name "/cloudmart/prod/db/password" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region "$REGION")

          if [ -z "$DB_USER" ] || [ "$DB_USER" = "None" ]; then
            echo "Database username was empty"
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ] || [ "$DB_PASSWORD" = "None" ]; then
            echo "Database password was empty"
            exit 1
          fi

          echo "[6/10] Reading dashboard admin token from SSM"
          ADMIN_TOKEN=$(aws ssm get-parameter \
            --name "/cloudmart/prod/auth/admin-token" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region "$REGION")

          if [ -z "$ADMIN_TOKEN" ] || [ "$ADMIN_TOKEN" = "None" ]; then
            echo "Dashboard admin token was empty"
            exit 1
          fi

          echo "[7/10] Creating persistent dashboard session secret"
          SECRET_FILE="/etc/cloudmart-dashboard-secret"
          if [ -s "$SECRET_FILE" ]; then
            DASHBOARD_SESSION_SECRET=$(cat "$SECRET_FILE")
          else
            DASHBOARD_SESSION_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
            printf '%s\n' "$DASHBOARD_SESSION_SECRET" > "$SECRET_FILE"
            chmod 600 "$SECRET_FILE"
          fi

          cat > /etc/cloudmart-dashboard.env <<ENV
          AWS_REGION=$REGION
          REPORTS_BUCKET=$REPORTS_BUCKET
          DB_HOST=$DB_HOST
          DB_NAME=cloudmart
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          ADMIN_TOKEN=$ADMIN_TOKEN
          DASHBOARD_SESSION_SECRET=$DASHBOARD_SESSION_SECRET
          PORT=80
          ENV

          chmod 600 /etc/cloudmart-dashboard.env

          echo "[8/10] Writing systemd dashboard service"
          cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICE
          [Unit]
          Description=CloudMart Flask Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=$APP_DIR
          EnvironmentFile=/etc/cloudmart-dashboard.env
          Environment=PYTHONPATH=$APP_DIR/vendor
          ExecStart=/usr/bin/python3 -m gunicorn --workers 2 --bind 0.0.0.0:80 app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          echo "[9/10] Starting dashboard service"
          systemctl daemon-reload
          systemctl enable cloudmart-dashboard || true
          systemctl restart cloudmart-dashboard

          sleep 5

          if systemctl is-active --quiet cloudmart-dashboard; then
            echo "Dashboard service is active"
          else
            echo "Dashboard service failed"
            systemctl status cloudmart-dashboard --no-pager || true
            journalctl -u cloudmart-dashboard --no-pager -n 80 || true
            exit 1
          fi

          echo "[10/10] Testing local dashboard HTTP endpoint"
          python3 - <<'PY'
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:80/", timeout=10)
          print("Dashboard HTTP health check passed")
          PY

          echo "Dashboard deployment completed successfully"
          SCRIPT

          sed -i \
            -e "s|__AWS_REGION__|${AWS_REGION}|g" \
            -e "s|__ARTIFACTS_BUCKET__|${{ steps.values.outputs.artifacts_bucket }}|g" \
            -e "s|__REPORTS_BUCKET__|${{ steps.values.outputs.reports_bucket }}|g" \
            -e "s|__DB_HOST__|${{ steps.values.outputs.db_host }}|g" \
            deploy-dashboard-on-ec2.sh

          base64 -w 0 deploy-dashboard-on-ec2.sh > deploy-dashboard-on-ec2.b64

      - name: Deploy dashboard through SSM
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_B64=$(cat deploy-dashboard-on-ec2.b64)

          EC2_INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-app \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardInstanceId'].OutputValue" \
            --output text)

          if [ -z "$EC2_INSTANCE_ID" ] || [ "$EC2_INSTANCE_ID" = "None" ]; then
            echo "DashboardInstanceId was not found in cloudmart-app"
            exit 1
          fi

          echo "Dashboard EC2 instance: $EC2_INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy CloudMart Flask dashboard" \
            --parameters "commands=[\"echo $SCRIPT_B64 | base64 -d > /tmp/deploy-dashboard-on-ec2.sh\", \"chmod +x /tmp/deploy-dashboard-on-ec2.sh\", \"sudo timeout 120 bash /tmp/deploy-dashboard-on-ec2.sh\"]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for attempt in {1..24}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Attempt $attempt/24: $STATUS"

            echo "----- EC2 STANDARD OUTPUT -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardOutputContent" \
              --output text 2>/dev/null || true

            echo "----- EC2 STANDARD ERROR -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" \
              --output text 2>/dev/null || true

            case "$STATUS" in
              Success)
                echo "Dashboard deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Dashboard deployment failed."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Dashboard deployment did not finish within 4 minutes."
          exit 1
